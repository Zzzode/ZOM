  - kind: RangeSyntax
    from: SuspendStatement    # 0x0E0
    to:   LetStmt             # 0x0EB
    name: FirstStmtFamily / LastStmtFamily

  - kind: RangeSyntax
    from: StandaloneImplDecl  # 0x0F0
    to:   FunctionParameterDecl  # 0x0F9
    name: FirstDeclFamily / LastDeclFamily

  # ── 3.2 Classification predicates (isExpr / isStmt / isDecl)
  - kind: Category
    name: isExpression
    includes:
      # Expr range (0x080..0x096)
      - WherePred
      - ThisExpr
      - IdentExpr
      - CallExpression
      - BinaryExpr
      - ConditionalExpr
      - AssignmentExpr
      - CommaExpr
      - MemberExpression
      - IndexExpression
      - NewExpression
      - FunctionExpression
      - ImportCallExpression
      - ObjectLiteralExpr
      - ObjectProperty
      - ObjectSpread
      - TemplateLiteralExpr
      - TypeOfExpression
      - UnaryExpression
      - PostfixExpression
      - CastExpression
      - LambdaExpression
      - SpawnExpression
      - StructLiteralExpr
      # LiteralExpr range (0x060..0x06C) counts as expressions
      - PositionalStructCtorExpr
      - TupleLiteral1
      - ErrorDefaultExpr
      - NullCoalesceExpr
      - IsExpression
      - NullLiteral
      - BoolLiteral
      - IntLiteral
      - FloatLiteral
      - BigIntLiteral
      - StrLiteral
      - ArrayLiteral
      - TupleLiteral
      - UnitLiteral
      # FFI expression-ish
      - UnsafeBlockExpr
      # Macro invocation
      - MacroInvocationExpr

  - kind: Category
    name: isStatement
    includes:
      # Stmt range (0x0E0..0x0EB)
      - SuspendStatement
      - UntilClause
      - BlockStmt
      - IfStmt
      - MatchStmt
      - WhileStmt
      - ForStmt
      - BreakStmt
      - ReturnStmt
      - StatementListItem
      - MatchArmStmt
      - LetStmt

  - kind: Category
    name: isNamedDeclaration
    includes:
      # Range nodes with bases=[NamedDeclaration]
      - ExternDecl
      - MacroRulesDecl
      - UnitVariant
      - TupleVariant
      - StructVariant
      - EnumDeclaration
      - PositionalStructDecl
      - ExternVarDecl
      - ExternStaticDecl
      - FFIConstDecl
      - ProcMacroDecl
      - StandaloneImplDecl
      - MarkerImpl
      - FunctionDecl
      - ClassDecl
      - StructDecl
      - FunctionParameterDecl

  # ── 3.3 Reflection metadata (NodeSchema[SyntaxKind] → fieldName/offset/typeName)
  - kind: Reflection
    purpose: "Auto-generated for LSP hover + Debugger pretty-printer + serialization schema"

  # ── 3.4 G2 Disjoint-Category Ranges (generated from categories: block above)
  #    For every category listed in §2b (Attribute, FFI, Macros, ..., Internal):
  #    kind: RangeSyntax → first_id=<category.first> last_id=<category.last>
  #    This produces `is<Category>Name(SyntaxKind)` constexpr predicates during codegen.
  #    Self-check 6 (§4.3) verifies non-overlap *before* these rows are expanded.

# ───────────────────────────────────────────────────────────
# 3b. G2 Well-Formedness Self-Checks (6 rules · runs before codegen)
# Documented in ast-data-structure.md §4.3. Modifying this list requires
# updating both the Python code generator implementation AND §4.3 listing
# AND the changelog. DO NOT edit silently.
# ───────────────────────────────────────────────────────────
self_checks:
  - id: sc1_variant_count_matches_enum
    severity: fatal            # any failure → codegen aborts
    applies_to: [variants, enums/SyntaxKind]
    rule: "len(variants) == len(SyntaxKind enum entries)"
    rationale: "Schema and generated enum must stay in lock-step; drift → silent UB on cast"

  - id: sc2_payload_fits_24B
    severity: fatal
    applies_to: [every variant.fields]
    rule: "sizeof(payload) ≤ codegen.payload_total_bytes (24 B by default)"
    rationale: "P2 SOP invariant: every Node must pack into 32 B = header 8B + payload 24B"

  - id: sc3_field_type_allowlist
    severity: fatal
    applies_to: [every field]
    rule: "field.type present in field_types: block (§4 below) OR is a generated enum"
    rationale: "Prevents P2/P4 violations (Own<T>, raw pointers, cross-Arena references) at schema-edit time"

  - id: sc4_cast_target_valid_and_category_compatible
    severity: fatal
    applies_to: [every field with cast:]
    rule: "cast target ∈ variants ∪ categories ∪ union_predicates  ∧  src_category ⊆ dst_category"
    rationale: "G2 rule 4 — catches typos and cross-category UB; typed variant traversal relies on subset relation. Union_predicates (Expression/TypeExpr/CfgPredicate/…) are allowed as 'category unions' for cast targets; sc4 expands them to the constituent concrete variants during the check."

  - id: sc5_named_decl_has_IdentId
    severity: warning          # warning so that draft schema with stub payloads can still generate
    applies_to: [variants with bases: [NamedDeclaration]]
    rule: "∃ at least one field with type = IdentId"
    rationale: "G2 rule 5 — nodes claiming to be NamedDeclarations must bind a name; IdentId field is the convention"

  - id: sc6_categories_disjoint
    severity: fatal
    applies_to: [categories block]
    rule: "∀ pairs (A, B) of categories: range(A) ∩ range(B) = ∅"
    rationale: "G2 rule 6 — RangeSyntax-derived predicates isExpr/isStmt/isDecl require non-overlapping ids"

# ───────────────────────────────────────────────────────────
# 3c. G3 Binary Stable Serialisation + Schema Fingerprint
# Documented in ast-data-structure.md §7.1.
# ───────────────────────────────────────────────────────────
schema_fingerprint:
  algorithm: SHA-256                 # 32 B · little-endian · written into every cache header
  canonicalizer:
    strip_comments: true             # drop YAML comments and whitespace between tokens
    sort_keys: [enums, categories, variants, derived, self_checks, field_types, codegen]
    variant_sort: by_id_hex          # emit variant rows in ascending id order (not file order)
  failure_modes:
    on_mismatch: reject_and_reparse  # never try to reinterpret a mismatched cache (UB-free)
    on_checksum_mismatch: hard_fail  # corruption detected → halt with diag::AST_cache_corrupt

binary_serde:
  format_version: 1                  # uint16 LE · header byte offset 8
  magic: "ZOMAST\0\0"                # uint64 · header byte offset 0
  header_size_B: 64                  # multiple of 64 B / cacheline aligned
  checksum: FNV1a_32_sections_1_5    # 4 B trailer · protects Node[] + 4 intern pools
  section_order: [nodes, idents, strings, bigints, floats, checksum]
  alignment_B: 64                    # mmap offset alignment

# ───────────────────────────────────────────────────────────
# 4. Field type lookup table (used by the code generator)
# ───────────────────────────────────────────────────────────
field_type_mapping:
  NodeId:         { cpp: "uint32_t", size: 4,  align: 4 }
  NodeList:       { cpp: "NodeList",       size: 8, align: 4, comment: "len≤2^16-1; oversized lists require splitting" }
  IdentList:      { cpp: "IdentList",      size: 8, align: 4, comment: "IdentId vector, same pack layout as NodeList" }
  IdentId:        { cpp: "uint32_t", size: 4,  align: 4 }
  StringId:       { cpp: "uint32_t", size: 4,  align: 4 }
  FloatId:        { cpp: "uint32_t", size: 4,  align: 4 }
  BigIntId:       { cpp: "uint32_t", size: 4,  align: 4 }
  bool:           { cpp: "bool",     size: 1,  align: 1, pack: "bitfield" }
  uint8:          { cpp: "uint8_t",  size: 1,  align: 1 }
  uint16:         { cpp: "uint16_t", size: 2,  align: 2 }
  uint32:         { cpp: "uint32_t", size: 4,  align: 4 }
  uint64:         { cpp: "uint64_t", size: 8,  align: 8 }
  Loc32:          { cpp: "::zomlang::compiler::source::Loc32", size: 4, align: 4, comment: "22b line + 10b column" }
  CfgOpKind:      { cpp: "CfgOpKind", size: 1, align: 1 }
  Abi:            { cpp: "Abi",       size: 2, align: 2 }
  MacroBrace:     { cpp: "MacroBrace",size: 1, align: 1 }
  CfgAtomValueKind: { cpp: "CfgAtomValueKind", size: 1, align: 1 }
  WhereBoundKind: { cpp: "WhereBoundKind", size: 1, align: 1 }
  ClassExtensibility: { cpp: "ClassExtensibility", size: 1, align: 1 }
  SuspendMode:    { cpp: "SuspendMode", size: 1, align: 1 }

  # G1 (ArenaBorrow §5.3): compiler-phase scope enum
  ArenaScope:     { cpp: "ArenaScope", size: 1, align: 1 }

# ───────────────────────────────────────────────────────────
# 5. Code generation parameters
# ───────────────────────────────────────────────────────────
codegen:
  target_cpp_standard: 20
  node_size_bytes: 32                 # Header 8 + Payload 24
  header_offset_loc:   4              # Loc32 starts at offset 4
  header_total_bytes: 8
  payload_total_bytes: 24
  max_node_count: 16777216            # 2^24 = 16M per Arena
  asserts_in_debug: true              # boundary / type-cast ASan assertions
  generate_reflection: true           # NodeSchema[]
  generate_json_dump: true
  generate_fnv1a_hash: true
  generate_deep_equal: true
  generate_clone:     true            # Arena-to-Arena
  generate_arena_borrow_typed_handles: true
  arena_borrow_forward_declare_variants: true
  serde_format_version: 1

  # G2 (Self-check 6 + category ranges)
  generate_category_ranges: true
  category_predicate_prefix: isCategory_

# ============================================================
# EOF
