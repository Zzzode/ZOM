version: "2.0"
project: "zomlang"
status: "ACCEPTED"

# This file is the implementation-side source of truth for syntax node payloads.
# Generated files are emitted into products/zomlang/compiler/ast/generated/ and
# are compiled as part of the main ast target in namespace zomlang::compiler::ast.

enums:

  # §20 FFI ABI convention
  Abi:
    type: uint16
    values: [ Cdecl, Stdcall, ZomNative ]

  # §12 Generics · Where clause bound
  WhereBoundKind:
    type: uint8
    values: [ Implements ]

  # §4.9 Concurrency · Detached modifier
  SuspendMode:
    type: uint8
    values: [ Bare, Until, OnTimeout ]

  ArenaScope:
    type: uint8
    values: [ Parser, Binder, Lowering ]

  LiteralPatternKind:
    type: uint8
    values: [ Integer, Float, BigInt, String, Char, Bool, Null ]

  UnaryOperatorKind:
    type: uint8
    values: [ Plus, Minus, LogicalNot, BitNot, Deref, Ref, RefMut, PreIncrement, PreDecrement ]

  PostfixOperatorKind:
    type: uint8
    values: [ Increment, Decrement, ErrorPropagate, ErrorUnwrap ]

  BinaryOperatorKind:
    type: uint16
    values: [ Add, Sub, Mul, Div, Mod, Pow, Shl, Shr, UShr, BitAnd, BitOr, BitXor, LogAnd, LogOr, Eq, Ne, StrictEq, StrictNe, Lt, Le, Gt, Ge ]

  BindingDeclarationKind:
    type: uint8
    values: [ Let, Mut, Const ]

  AssignmentOperatorKind:
    type: uint8
    values: [ Assign, AddAssign, SubAssign, MulAssign, DivAssign, ModAssign, PowAssign, ShlAssign, ShrAssign, UShrAssign, BitAndAssign, BitOrAssign, BitXorAssign, LogicalAndAssign, LogicalOrAssign, NullCoalesceAssign ]

  MemberAccessKind:
    type: uint8
    values: [ Dot, Optional, Qualified ]

  CaptureMode:
    type: uint8
    values: [ ByValue, ByRef, This ]

  # §13 Leading module declaration forms
  ModuleDeclarationForm:
    type: uint8
    values: [ RootDeclaration, InlineRoot, Alias ]

categories:
  Module:          { first: 0x170, last: 0x17F, desc: "source files and module paths" }
  Attribute:       { first: 0x00, last: 0x0F, desc: "§19 conditional / attribute" }
  FFI:             { first: 0x10, last: 0x1F, desc: "§20 extern / unsafe" }
  EnumVariant:     { first: 0x30, last: 0x3F, desc: "§10 enum three-form variants" }
  Pattern:         { first: 0x40, last: 0x5F, desc: "§7 patterns (exhaustive match)" }
  LiteralExpr:     { first: 0x60, last: 0x7F, desc: "§4 literals + basic expressions" }
  Expr:            { first: 0x80, last: 0xBF, desc: "§4 expressions (RangeSyntax Expr union = LiteralExpr ∪ Expr)" }
  Type:            { first: 0xC0, last: 0xDF, desc: "§3 type expressions" }
  Statement:       { first: 0xE0, last: 0x10F, desc: "§5 statements" }
  Declaration:     { first: 0x110, last: 0x16F, desc: "§6 declarations" }
  TypeMember:      { first: 0x180, last: 0x18F, desc: "§3 structural type members" }

# ── G2 sc4 / sc6 augmentation: Category-Abstract Unions ──────────────────
# The names listed below are NOT concrete variant ids — they are UNION /
# SUPERSET predicates used only inside `cast:` target validations and the
# RangeSyntax classifier. They must NOT appear in any variant's `id:` field.
# Self-check 4 treats any cast target present in this list as a "sub-type"
# of the category that its name describes; the cross-category disjointness
# check (sc6) skips them (they are purposefully overlapping unions).
union_predicates:
  - Expression       # LiteralExpr ∪ Expr ∪ UnsafeBlockExpr ∪ ...
  - TypeExpr         # any variant whose id lies in Type [0xC0..0xDF]
  - Statement        # Statement category ∪ SuspendStatement expansion
  - Declaration      # Declaration category (see categories block above)
  - Pattern          # Pattern category
  - Identifier       # Named variant: IdentPath / IdentExpr / plain Identifier
  - BlockStmt        # BlockExpression (statement-as-expression block body)
  - TokenNode        # Leaf variants produced by the lexer (identifier tokens, literal terminal wrappers)
  - ParameterDecl    # FunctionParameterDecl
  - TypeParamDecl    # Generic type parameter declaration variants
  - PropertyDecl     # Struct property declaration variants
  - ClassElement     # callable, field, constant, and associated-type members
  - ObjectLiteralElement # ObjectProperty / ObjectSpread union
# ───────────────────────────────────────────────────────────
variants:

# 0x170..0x17F Source / Module roots
  - id: 0x170
    name: SourceFile
    doc: "Compilation-unit root node"
    fields:
      - {name: file_name, type: StringId}
      - {name: module, type: NodeId, cast: ModuleDeclaration, optional: true}
      - {name: statements, type: NodeList, cast: StatementListItem}

  - id: 0x171
    name: ModulePath
    doc: "Qualified module path"
    fields:
      - {name: segments, type: IdentList}
      - {name: root, type: uint8, enum: [Relative, Absolute]}

  - id: 0x172
    name: ImportDeclaration
    doc: "import path[.{specifiers}] [as alias];"
    fields:
      - {name: path, type: NodeId, cast: ModulePath}
      - {name: alias, type: IdentId, optional: true}
      - {name: specifiers, type: NodeList, cast: ImportSpecifier, optional: true}

  - id: 0x173
    name: ExportDeclaration
    doc: "export declaration or export list"
    fields:
      - {name: declaration, type: NodeId, optional: true}
      - {name: path, type: NodeId, cast: ModulePath, optional: true}
      - {name: specifiers, type: NodeList, cast: ExportSpecifier, optional: true}

  - id: 0x174
    name: ImportSpecifier
    doc: "named import specifier"
    fields:
      - {name: name, type: IdentId}
      - {name: alias, type: IdentId, optional: true}

  - id: 0x175
    name: ExportSpecifier
    doc: "named export specifier"
    fields:
      - {name: name, type: IdentId}
      - {name: alias, type: IdentId, optional: true}

# 0x00..0x0F Attributes (3)
  - id: 0x000
    name: AttributeList
    doc:  "Attr list (intrusive head+len)"
    fields:
      - {name: attrs, type: NodeList, cast: Attribute}

  - id: 0x001
    name: AttributePath
    doc:  "Qualified attribute or marker path (255 segment bound)"
    fields:
      - {name: segments, type: IdentList, maxlen: 255}
      - {name: leading, type: uint8, enum: ["None", Crate, Self, Super, Root]}

  - id: 0x002
    name: Attribute
    doc:  "General #[path(arg1, arg2)] attribute"
    fields:
      - {name: path, type: NodeId, cast: AttributePath}
      - {name: args, type: NodeList, cast: Expression}

# 0x10..0x1F FFI / Unsafe
  - id: 0x010
    name: ExternDecl
    bases: [NamedDeclaration]
    doc:  "extern fun name(params) -> Ret raises E;"
    fields:
      - {name: name, type: IdentId}
      - {name: abi, type: Abi, default: Cdecl}
      - {name: params, type: NodeList, cast: ParameterDecl}
      - {name: ret_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: raises_ty, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x011
    name: UnsafeBlockExpr
    doc:  "unsafe { ... } block expression"
    fields:
      - {name: body, type: NodeId, cast: BlockStmt}

  - id: 0x012
    name: ExternBlock
    doc:  "extern \"ABI\" { fun ...; variable ...; }"
    fields:
      - {name: abi, type: Abi, default: Cdecl}
      - {name: items, type: NodeList}

  - id: 0x014
    name: ExternVarDecl
    bases: [NamedDeclaration]
    doc:  "extern var name: T; — imported global"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: abi, type: Abi, default: Cdecl}
      - {name: is_mut, type: bool}

# 0x30..0x3F Enum Variants (13)
  - id: 0x030
    name: UnitVariant
    bases: [DeclarationStatement]
    doc:  "enum E { Plain = const_expr } (no fields, optional discriminant)"
    fields:
      - {name: name, type: IdentId}
      - {name: discriminant, type: NodeId, cast: Expression, optional: true}

  - id: 0x031
    name: TupleVariant
    bases: [DeclarationStatement]
    doc:  "enum E { Color(u8, u8, u8) } (positional fields)"
    fields:
      - {name: name, type: IdentId}
      - {name: nfields, type: uint16}
      - {name: tys, type: NodeList, cast: TypeExpr}
      - {name: discriminant, type: NodeId, cast: Expression, optional: true}

  - id: 0x033
    name: EnumDeclaration
    bases: [NamedDeclaration]
    doc:  "Enum declaration with unit and tuple variants"
    fields:
      - {name: name, type: IdentId}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: variants_id, type: NodeId, cast: EnumVariantList}

  - id: 0x03C
    name: EnumVariantList
    doc:  "Container for enum variant nodes"
    fields:
      - {name: nvars, type: uint16}
      - {name: variants, type: NodeList}

# 0x40..0x5F Patterns (20)
  - id: 0x040
    name: RestPattern
    doc:  "...rest / ... (tail binding in Tuple/Struct/Array/Object)"
    fields:
      - {name: binding, type: IdentId, optional: true}

  - id: 0x041
    name: LiteralPattern
    doc:  "Literal pattern in match arm (numeric / char / string / bool / null)"
    fields:
      - {name: literal, type: NodeId, cast: Expression}

  - id: 0x042
    name: IsPattern
    doc:  "expr is Type — pattern-level is"
    fields:
      - {name: ty, type: NodeId, cast: TypeExpr}

  - id: 0x043
    name: WildcardPattern
    doc:  "_ wildcard (irrefutable)"
    fields:
      - {name: ty, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x044
    name: BindingPattern
    doc:  "name @ pattern bind + sub-pattern"
    fields:
      - {name: name, type: IdentId}
      - {name: is_mut, type: bool}
      - {name: is_ref, type: bool}
      - {name: sub, type: NodeId, cast: Pattern, optional: true}

  - id: 0x045
    name: IdentifierPattern
    doc:  "Single binding identifier (always irrefutable)"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x046
    name: TuplePattern
    doc:  "(p1, p2, ..pn) tuple destructuring"
    fields:
      - {name: pats, type: NodeList, cast: Pattern}

  - id: 0x047
    name: StructPattern
    doc:  "Type { field: pat, ..rest } destructuring"
    fields:
      - {name: ty_path, type: NodeId, cast: Identifier, optional: true}
      - {name: fields, type: NodeList, cast: PatternProperty}
      - {name: rest, type: NodeId, cast: RestPattern, optional: true}

  - id: 0x048
    name: PatternProperty
    doc:  "Single field inside struct/object pattern"
    fields:
      - {name: name, type: IdentId}
      - {name: short_form, type: bool}
      - {name: pat, type: NodeId, cast: Pattern, optional: true}

  - id: 0x049
    name: ArrayPattern
    doc:  "[p0, p1, ..rest] fixed-width array destructuring"
    fields:
      - {name: pats, type: NodeList, cast: Pattern}
      - {name: rest, type: NodeId, cast: RestPattern, optional: true}

  - id: 0x04A
    name: ExpressionPattern
    doc:  "Expression used as a pattern discriminator"
    fields:
      - {name: expr, type: NodeId, cast: Expression}

  - id: 0x04B
    name: EnumPattern
    doc:  "Enum variant pattern such as Result.Ok(value)"
    fields:
      - {name: path, type: NodeId, cast: ModulePath}
      - {name: args, type: NodeList, cast: Pattern}

# 0x60..0x7F Literal / Leaf Expressions
  - id: 0x062
    name: ErrorDefaultExpr
    doc:  "a ?: fallback error-default operator"
    fields:
      - {name: primary, type: NodeId, cast: Expression}
      - {name: fallback, type: NodeId, cast: Expression}

  - id: 0x063
    name: NullCoalesceExpr
    doc:  "a ?? fallback null coalesce"
    fields:
      - {name: primary, type: NodeId, cast: Expression}
      - {name: fallback, type: NodeId, cast: Expression}

  - id: 0x064
    name: IsExpression
    doc:  "expr is TypeExpr (strict type test, does not trigger coerce)"
    fields:
      - {name: expr, type: NodeId, cast: Expression}
      - {name: ty, type: NodeId, cast: TypeExpr}

  - id: 0x065
    name: NullLiteral
    doc:  "null literal (inhabits the null type)"
    fields:
      []

  - id: 0x066
    name: BoolLiteral
    doc:  "true / false literal"
    fields:
      - {name: value, type: bool}

  - id: 0x067
    name: IntLiteral
    doc:  "Arbitrary base integer literal"
    fields:
      - {name: base, type: uint8}
      - {name: value, type: BigIntId}

  - id: 0x068
    name: FloatLiteralExpr
    doc:  "IEEE-754 floating-point literal"
    fields:
      - {name: width, type: uint8}
      - {name: value, type: FloatId}

  - id: 0x069
    name: BigIntLiteral
    doc:  "123n arbitrary-precision big integer literal"
    fields:
      - {name: value, type: BigIntId}

  - id: 0x06A
    name: StringLiteralExpr
    doc:  "Double-quoted string literal"
    fields:
      - {name: value, type: StringId}

  - id: 0x06B
    name: ArrayLiteral
    doc:  "[a, b, c] array literal"
    fields:
      - {name: elems, type: NodeList, cast: Expression}

  - id: 0x06C
    name: TupleLiteral
    doc:  "() / (a, b, c) n-ary tuple literal"
    fields:
      - {name: elems, type: NodeList, cast: Expression}

  - id: 0x06D
    name: UnitLiteral
    doc:  "unit literal expression"
    fields:
      []

  - id: 0x06E
    name: CharacterLiteralExpr
    doc:  "Single Unicode scalar character literal"
    fields:
      - {name: value, type: StringId}

  - id: 0x06F
    name: NoSubstitutionTemplateLiteralExpr
    doc:  "Template literal without substitutions"
    fields:
      - {name: value, type: StringId}

# 0x80..0xBF Expressions (46)
  - id: 0x080
    name: WherePred
    doc:  "Single where predicate (Subtype / Implements / SendableMarker)"
    fields:
      - {name: kind, type: WhereBoundKind}
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: bound, type: NodeId, cast: TypeExpr}

  - id: 0x081
    name: ThisExpr
    doc:  "this receiver in class/struct methods"
    fields:
      []

  - id: 0x082
    name: IdentExpr
    doc:  "Plain identifier in expression position"
    fields:
      - {name: name, type: IdentId}

  - id: 0x083
    name: CallExpression
    doc:  "callee(a1, a2, ...) general call"
    fields:
      - {name: callee, type: NodeId, cast: Expression}
      - {name: type_args, type: NodeList, cast: TypeExpr, optional: true}
      - {name: args, type: NodeList, cast: Expression}

  - id: 0x084
    name: BinaryExpr
    doc:  "Arithmetic / bitwise / logical / relational op"
    fields:
      - {name: op, type: BinaryOperatorKind}
      - {name: lhs, type: NodeId, cast: Expression}
      - {name: rhs, type: NodeId, cast: Expression}

  - id: 0x085
    name: ConditionalExpr
    doc:  "cond ? a : b ternary conditional"
    fields:
      - {name: cond, type: NodeId, cast: Expression}
      - {name: then_expr, type: NodeId, cast: Expression}
      - {name: else_expr, type: NodeId, cast: Expression}

  - id: 0x086
    name: AssignmentExpr
    doc:  "lhs op= rhs assignment expression"
    fields:
      - {name: op, type: AssignmentOperatorKind}
      - {name: lhs, type: NodeId, cast: Expression}
      - {name: rhs, type: NodeId, cast: Expression}

  - id: 0x087
    name: CommaExpr
    doc:  "a, b, c comma expression"
    fields:
      - {name: elems, type: NodeList, cast: Expression}

  - id: 0x088
    name: MemberExpression
    doc:  "object.property, object?.property, or object::property member access"
    fields:
      - {name: object, type: NodeId, cast: Expression}
      - {name: property, type: IdentId}
      - {name: access, type: MemberAccessKind}

  - id: 0x089
    name: IndexExpression
    doc:  "object[index] indexed member access"
    fields:
      - {name: object, type: NodeId, cast: Expression}
      - {name: index, type: NodeId, cast: Expression}

  - id: 0x08A
    name: NewExpression
    doc:  "new Constructor<T>(args...) allocation or construction expression"
    fields:
      - {name: callee, type: NodeId, cast: Expression}
      - {name: type_args, type: NodeList, cast: TypeExpr, optional: true}
      - {name: args, type: NodeList, cast: Expression, optional: true}

  - id: 0x08B
    name: FunctionExpression
    doc:  "fun<T>(params) use [captures] -> Ret raises E { body } expression"
    fields:
      - {name: params_id, type: NodeId, cast: FunctionParameterList}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: captures_id, type: NodeId, cast: CaptureList, optional: true}
      - {name: ret_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: raises_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: body, type: NodeId, cast: BlockStmt}

  - id: 0x08C
    name: ImportCallExpression
    doc:  "import(specifier) expression"
    fields:
      - {name: args, type: NodeList, cast: Expression}

  - id: 0x08D
    name: ObjectLiteralExpr
    doc:  "{ key: value, shorthand, ...spread } object literal expression"
    fields:
      - {name: properties, type: NodeList, cast: ObjectLiteralElement}

  - id: 0x08E
    name: ObjectProperty
    doc:  "Single object literal property"
    fields:
      - {name: name, type: IdentId}
      - {name: value, type: NodeId, cast: Expression, optional: true}
      - {name: short_form, type: bool}

  - id: 0x08F
    name: ObjectSpread
    doc:  "...expr object literal spread"
    fields:
      - {name: expr, type: NodeId, cast: Expression}

  - id: 0x090
    name: TemplateLiteralExpr
    doc:  "Template literal with embedded expressions"
    fields:
      - {name: exprs, type: NodeList, cast: Expression}

  - id: 0x091
    name: TypeOfExpression
    doc:  "typeof expression"
    fields:
      - {name: expr, type: NodeId, cast: Expression}

  - id: 0x092
    name: UnaryExpression
    doc:  "Prefix unary expression"
    fields:
      - {name: op, type: UnaryOperatorKind}
      - {name: operand, type: NodeId, cast: Expression}

  - id: 0x093
    name: PostfixExpression
    doc:  "Postfix update or error propagation expression"
    fields:
      - {name: op, type: PostfixOperatorKind}
      - {name: operand, type: NodeId, cast: Expression}

  - id: 0x094
    name: CastExpression
    doc:  "expr as/as?/as! TypeExpr cast expression"
    fields:
      - {name: mode, type: uint8, enum: [As, AsQuestion, AsBang]}
      - {name: expr, type: NodeId, cast: Expression}
      - {name: ty, type: NodeId, cast: TypeExpr}

  - id: 0x095
    name: LambdaExpression
    doc:  "(params) -> Ret raises E => expr or block expression"
    fields:
      - {name: params_id, type: NodeId, cast: FunctionParameterList}
      - {name: ret_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: raises_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: body, type: NodeId, cast: BlockStmt, optional: true}
      - {name: expr_body, type: NodeId, cast: Expression, optional: true}

  - id: 0x096
    name: SpawnExpression
    bases: [Expression]
    doc:  "spawn detached { ... } / spawn priority(high) { ... }"
    fields:
      - {name: mod_flags, type: uint8}
      - {name: priority, type: uint8, enum: [None, High, Low]}
      - {name: body, type: NodeId, cast: Statement}

  - id: 0x097
    name: StructLiteralExpr
    bases: [Expression]
    doc:  "Nominal struct literal expression such as Point { x: 1 } or Vec3<f32> { x: 1.0 }"
    fields:
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: properties, type: NodeList, cast: ObjectLiteralElement}

  - id: 0x098
    name: CaptureItem
    doc:  "Single function-expression capture"
    fields:
      - {name: mode, type: CaptureMode}
      - {name: name, type: IdentId}

  - id: 0x099
    name: SuperExpr
    doc:  "super receiver in class methods (base-class dispatch)"
    fields:
      []

  - id: 0x09A
    name: CaptureList
    doc:  "Function-expression capture list wrapper"
    fields:
      - {name: n_captures, type: uint16}
      - {name: captures, type: NodeList, cast: CaptureItem}

# 0xC0..0xDF Type Expressions (25)
  - id: 0x0C0
    name: DynTypeExpr
    doc:  "Existential: dyn Display<Item = T> + Sendable + 'static"
    fields:
      - {name: principal, type: NodeId, cast: TypeExpr}
      - {name: markers_id, type: NodeId, cast: DynTypeMarkerList, optional: true}
      - {name: assoc_bindings_id, type: NodeId, cast: DynTypeAssocBindingList, optional: true}

  - id: 0x0CC
    name: DynTypeMarkerList
    doc:  "Container for dyn lifetime + marker list"
    fields:
      - {name: n_markers, type: uint8}
      - {name: markers, type: NodeList, cast: AttributePath}

  - id: 0x0D3
    name: DynTypeAssocBinding
    doc:  "Associated type binding in a dyn head: Item = T"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr}

  - id: 0x0D4
    name: DynTypeAssocBindingList
    doc:  "Container for associated type bindings in a dyn head"
    fields:
      - {name: n_bindings, type: uint8}
      - {name: bindings, type: NodeList, cast: DynTypeAssocBinding}

  - id: 0x0C2
    name: FixedArrayTypeExpr
    doc:  "[T; N] fixed-length array type"
    fields:
      - {name: elem, type: NodeId, cast: TypeExpr}
      - {name: len_expr, type: NodeId, cast: Expression}

  - id: 0x0C3
    name: SliceArrayTypeExpr
    doc:  "[T] dynamic slice"
    fields:
      - {name: elem, type: NodeId, cast: TypeExpr}

  - id: 0x0C4
    name: OptionalTypeExpr
    doc:  "T? (null-coalescing prerequisite)"
    fields:
      - {name: inner, type: NodeId, cast: TypeExpr}
      - {name: double, type: bool}

  - id: 0x0C5
    name: NamedTypeExpr
    doc:  "Plain type name reference"
    fields:
      - {name: path, type: NodeId, cast: Identifier}
      - {name: args, type: NodeList, cast: TypeExpr, optional: true}

  - id: 0x0C6
    name: PredefinedTypeExpr
    doc:  "i8/i16/.../unit/never/any predefined type token"
    fields:
      - {name: kind, type: uint8, enum: [I8, I16, I32, I64, U8, U16, U32, U64, F32, F64, Bool, Str, Char, Null, Unit, Never, Any]}

  - id: 0x0C7
    name: FunctionTypeExpr
    doc:  "(P1,P2) -> R raises E type-level arrow"
    fields:
      - {name: params, type: NodeList, cast: TypeExpr}
      - {name: ret_ty, type: NodeId, cast: TypeExpr}
      - {name: raises, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x0C8
    name: UnionTypeExpr
    doc:  "A | B | C untagged union"
    fields:
      - {name: alts, type: NodeList, cast: TypeExpr}

  - id: 0x0C9
    name: IntersectionTypeExpr
    doc:  "A & B & C intersection"
    fields:
      - {name: alts, type: NodeList, cast: TypeExpr}

  - id: 0x0CA
    name: ArrayTypeExpr
    doc:  "T[] owned dynamic array type"
    fields:
      - {name: elem, type: NodeId, cast: TypeExpr}

  - id: 0x0D1
    name: ReferenceTypeExpr
    doc:  "&T / &mut T reference type"
    fields:
      - {name: elem, type: NodeId, cast: TypeExpr}
      - {name: is_mut, type: bool}

  - id: 0x0D2
    name: RawPointerTypeExpr
    doc:  "*const T / *mut T raw pointer type"
    fields:
      - {name: elem, type: NodeId, cast: TypeExpr}
      - {name: is_mut, type: bool}

  - id: 0x0CD
    name: TypeQueryExpr
    doc:  "typeof path type query"
    fields:
      - {name: path, type: NodeId, cast: ModulePath}

  - id: 0x0CE
    name: ObjectTypeExpr
    doc:  "{ member: Type; method(args): Ret } structural object type"
    fields:
      - {name: members, type: NodeList, cast: ObjectTypeMember, optional: true}

  - id: 0x0CF
    name: TupleTypeExpr
    doc:  "(T1, T2) tuple type"
    fields:
      - {name: elems, type: NodeList, cast: TypeExpr}

  - id: 0x0D0
    name: AssociatedTypeProjectionExpr
    doc:  "Fully qualified associated type projection: <T as Interface>::Item"
    fields:
      - {name: base_ty, type: NodeId, cast: TypeExpr}
      - {name: iface_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: name, type: IdentId}

  - id: 0x180
    name: ObjectTypeMember
    doc:  "Single structural object type field"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: is_mut, type: bool}
      - {name: is_optional, type: bool}

# 0xE0..0x10F Statements
  - id: 0x0E0
    name: SuspendStatement
    bases: [Statement]
    doc:  "suspend; / suspend until predicate;"
    fields:
      - {name: mode, type: SuspendMode}
      - {name: until_cond, type: NodeId, cast: Expression, optional: true}
      - {name: on_timeout_ms, type: uint32, optional: true}

  - id: 0x0E2
    name: BlockStmt
    doc:  "{ stmt* } statement-level block"
    fields:
      - {name: stmts, type: NodeList, cast: StatementListItem}

  - id: 0x0E3
    name: IfStmt
    doc:  "if (cond) then [else else_]"
    fields:
      - {name: cond, type: NodeId, cast: Expression}
      - {name: then_stmt, type: NodeId, cast: Statement}
      - {name: else_stmt, type: NodeId, cast: Statement, optional: true}

  - id: 0x0E4
    name: MatchStmt
    doc:  "match (scrutinee) { when p => s ... } statement form"
    fields:
      - {name: scrutinee, type: NodeId, cast: Expression}
      - {name: arms, type: NodeList, cast: MatchArmStmt}

  - id: 0x0E5
    name: WhileStmt
    doc:  "while (cond) body"
    fields:
      - {name: cond, type: NodeId, cast: Expression}
      - {name: body, type: NodeId, cast: Statement}

  - id: 0x0E6
    name: ForStmt
    doc:  "C-style for (init; cond; update) body"
    fields:
      - {name: init, type: NodeId, cast: Statement, optional: true}
      - {name: cond, type: NodeId, cast: Expression, optional: true}
      - {name: update, type: NodeId, cast: Expression, optional: true}
      - {name: body, type: NodeId, cast: Statement}

  - id: 0x0E7
    name: BreakStmt
    doc:  "break [label];"
    fields:
      - {name: label, type: IdentId, optional: true}

  - id: 0x0E8
    name: ReturnStmt
    doc:  "return [value];"
    fields:
      - {name: value, type: NodeId, cast: Expression, optional: true}

  - id: 0x0E9
    name: StatementListItem
    doc:  "Tagged wrapper inside BlockStmt items; item list head+item (Statement or Declaration as statement (Statement"
    fields:
      - {name: item, type: NodeId}
      - {name: attrs, type: NodeId, cast: AttributeList, optional: true}

  - id: 0x0EA
    name: MatchArmStmt
    doc:  "when pattern guard? => body (match arm statement"
    fields:
      - {name: pattern, type: NodeId, cast: Pattern}
      - {name: guard, type: NodeId, cast: Expression, optional: true}
      - {name: body, type: NodeId, cast: Statement}

  - id: 0x0EB
    name: LetStmt
    doc:  "let|mut|const declarator-list statement"
    fields:
      - {name: kind, type: BindingDeclarationKind}
      - {name: declarations, type: NodeId, cast: VariableDeclaratorList}

  - id: 0x0EC
    name: ModuleDeclaration
    doc: "Leading module root declaration, inline root, or module alias"
    fields:
      - {name: form, type: ModuleDeclarationForm}
      - {name: declared_name, type: IdentId}
      - {name: alias_target, type: NodeId, cast: ModulePath, optional: true}
      - {name: inline_items, type: NodeList, cast: StatementListItem, optional: true}
      - {name: exported_alias, type: bool}

  - id: 0x0ED
    name: ExpressionStatement
    doc: "expression;"
    fields:
      - {name: expression, type: NodeId, cast: Expression, optional: true}

  - id: 0x0EE
    name: EmptyStatement
    doc: ";"
    fields: []

  - id: 0x0EF
    name: LabeledStatement
    doc: "label: statement"
    fields:
      - {name: label, type: IdentId}
      - {name: statement, type: NodeId, cast: Statement, optional: true}

  - id: 0x0F0
    name: ForInStatement
    doc: "for (binding in expression) body"
    fields:
      - {name: binding, type: NodeId, cast: Pattern, optional: true}
      - {name: expression, type: NodeId, cast: Expression, optional: true}
      - {name: body, type: NodeId, cast: Statement, optional: true}

  - id: 0x0F1
    name: DoWhileStatement
    doc: "do body while (cond);"
    fields:
      - {name: body, type: NodeId, cast: Statement, optional: true}
      - {name: cond, type: NodeId, cast: Expression, optional: true}

  - id: 0x0F2
    name: DebuggerStatement
    doc: "debugger;"
    fields: []

  - id: 0x0F3
    name: ContinueStatement
    doc: "continue [label];"
    fields:
      - {name: label, type: IdentId, optional: true}

  - id: 0x0F4
    name: VariableDeclaratorList
    doc: "VariableDeclarationList ::= VariableDeclaration (',' VariableDeclaration)*"
    fields:
      - {name: n_decls, type: uint16}
      - {name: decls, type: NodeList, cast: VariableDeclarator}

  - id: 0x0F5
    name: VariableDeclarator
    doc: "(BindingIdentifier | BindingPattern) TypeAnnotation? Initializer?"
    fields:
      - {name: pattern, type: NodeId, cast: Pattern}
      - {name: ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: init, type: NodeId, cast: Expression, optional: true}

# 0x110..0x16F Declarations
  - id: 0x110
    name: StandaloneImplDecl
    bases: [DeclarationStatement]
    doc:  "impl Hash for MyType where T: Send { fun hash(...) -> u64; ... }"
    fields:
      - {name: is_unsafe, type: bool}
      - {name: interface, type: NodeId, cast: TypeExpr}
      - {name: for_ty, type: NodeId, cast: TypeExpr}
      - {name: where_, type: NodeId, cast: WhereClause, optional: true}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: members_id, type: NodeId, cast: ClassMemberList, optional: true}

  - id: 0x111
    name: MarkerImpl
    bases: [DeclarationStatement]
    doc:  "unsafe impl marker::Sendable for *mut u8;"
    fields:
      - {name: is_unsafe, type: bool}
      - {name: is_negated, type: bool}
      - {name: marker_path, type: NodeId, cast: AttributePath}
      - {name: for_ty, type: NodeId, cast: TypeExpr}

  - id: 0x112
    name: WhereClause
    doc:  "where T: Send + 'static, U: PartialEq<T>"
    fields:
      - {name: preds, type: NodeList, cast: WherePred}

  - id: 0x115
    name: FunctionDecl
    bases: [NamedDeclaration]
    doc:  "fun name(params) -> Ret raises E { body }"
    fields:
      - {name: name, type: IdentId}
      - {name: params_id, type: NodeId, cast: FunctionParameterList}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: ret_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: raises_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: body, type: NodeId, cast: BlockStmt}

  - id: 0x116
    name: ClassDecl
    bases: [NamedDeclaration]
    doc:  "class Name<T> : Base { ... }"
    fields:
      - {name: name, type: IdentId}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: base_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: members_id, type: NodeId, cast: ClassMemberList, optional: true}

  - id: 0x117
    name: StructDecl
    bases: [NamedDeclaration]
    doc:  "struct Name<T> { field: T, ... }"
    fields:
      - {name: name, type: IdentId}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: members_id, type: NodeId, cast: ClassMemberList, optional: true}

  - id: 0x118
    name: GenericParams
    doc:  "<T: Copy, U: Debug = u32> generic parameter list wrapper with optional where-clause"
    fields:
      - {name: nparams, type: uint16}
      - {name: params, type: NodeList, cast: TypeParamDecl}
      - {name: where_, type: NodeId, cast: WhereClause, optional: true}

  - id: 0x119
    name: FunctionParameterDecl
    bases: [NamedDeclaration]
    doc:  "positional function parameter: name : T [= default]"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: default_, type: NodeId, cast: Expression, optional: true}
      - {name: attrs, type: NodeId, cast: AttributeList, optional: true}

  - id: 0x11A
    name: FunctionParameterList
    doc:  "(a : T, b : U, ...) function parameter list wrapper"
    fields:
      - {name: nparams, type: uint16}
      - {name: params, type: NodeList, cast: ParameterDecl}

  - id: 0x11B
    name: ImplIfaceList
    doc:  "A + B + C interface heritage list"
    fields:
      - {name: ifaces, type: NodeList, cast: TypeExpr}

  - id: 0x11C
    name: ClassMemberList
    doc:  "Sequential container of class/struct/interface body members"
    fields:
      - {name: nmembers, type: uint16}
      - {name: members, type: NodeList, cast: ClassElement}

  - id: 0x11D
    name: InterfaceDecl
    bases: [NamedDeclaration]
    doc: "interface Name : I + J { members }"
    fields:
      - {name: name, type: IdentId}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: ifaces_id, type: NodeId, cast: ImplIfaceList, optional: true}
      - {name: members_id, type: NodeId, cast: ClassMemberList, optional: true}

  - id: 0x11E
    name: ErrorDecl
    bases: [NamedDeclaration]
    doc: "error Name { members }"
    fields:
      - {name: name, type: IdentId}
      - {name: members_id, type: NodeId, cast: ClassMemberList, optional: true}

  - id: 0x11F
    name: AliasDecl
    bases: [NamedDeclaration]
    doc: "type Name = Type;"
    fields:
      - {name: name, type: IdentId}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: target, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x120
    name: MethodDecl
    bases: [DeclarationStatement]
    doc:  "Class/struct/interface method: [modifiers] fun name(params) -> Ret { body }"
    fields:
      - {name: name, type: IdentId}
      - {name: params_id, type: NodeId, cast: FunctionParameterList}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: ret_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: raises_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: body, type: NodeId, cast: BlockStmt, optional: true}
      - {name: mode, type: uint8, enum: [Instance, Static, Mutating, StaticMutating]}
      - {name: visibility, type: uint8, enum: [Default, Public, Private, Protected]}

  - id: 0x121
    name: FieldDecl
    bases: [DeclarationStatement]
    doc:  "Class/struct field declaration: [modifiers] [mut] name: Ty [= init]"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: init, type: NodeId, cast: Expression, optional: true}
      - {name: is_mut, type: bool}
      - {name: is_static, type: bool}
      - {name: visibility, type: uint8, enum: [Default, Public, Private, Protected]}

  - id: 0x122
    name: AssociatedTypeDecl
    bases: [DeclarationStatement]
    doc:  "Interface associated type: type Name [<T...>] [: Bound (+ Bound)*] [= DefaultTy];"
    fields:
      - {name: name, type: IdentId}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: bounds_id, type: NodeId, cast: AssociatedTypeBoundList, optional: true}
      - {name: default_ty, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x123
    name: GenericTypeParam
    doc:  "Generic type parameter: Name [: Bound (+ Bound)*] [= DefaultTy]"
    fields:
      - {name: name, type: IdentId}
      - {name: bounds_id, type: NodeId, cast: TypeParameterBoundList, optional: true}
      - {name: default_ty, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x127
    name: TypeParameterBoundList
    doc:  "Ordered generic parameter bound conjunction: Bound (+ Bound)*"
    fields:
      - {name: bounds, type: NodeList, cast: TypeExpr}

  - id: 0x128
    name: AssociatedTypeBoundList
    doc:  "Ordered associated type bound conjunction: Bound (+ Bound)*"
    fields:
      - {name: bounds, type: NodeList, cast: TypeExpr}

  - id: 0x124
    name: ConstructorDecl
    bases: [DeclarationStatement]
    doc: "Class/struct/error constructor declaration"
    fields:
      - {name: name, type: IdentId}
      - {name: params_id, type: NodeId, cast: FunctionParameterList}
      - {name: raises_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: body, type: NodeId, cast: BlockStmt}
      - {name: visibility, type: uint8, enum: [Default, Public, Private, Protected]}

  - id: 0x125
    name: DestructorDecl
    bases: [DeclarationStatement]
    doc: "Class/struct/error destructor declaration"
    fields:
      - {name: name, type: IdentId}
      - {name: params_id, type: NodeId, cast: FunctionParameterList}
      - {name: raises_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: body, type: NodeId, cast: BlockStmt}
      - {name: visibility, type: uint8, enum: [Default, Public, Private, Protected]}

  - id: 0x126
    name: ClassConstDecl
    bases: [DeclarationStatement]
    doc: "Compile-time constant declared inside a type body"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: init, type: NodeId, cast: Expression, optional: true}
      - {name: is_static, type: bool}
      - {name: visibility, type: uint8, enum: [Default, Public, Private, Protected]}

# 3. Derived Information (does not affect storage, pure codegen aid)
# ───────────────────────────────────────────────────────────
derived:

  # ── 3.1 Range constants for FirstXXX / LastXXX helpers ────
  #   All ranges line up with each category's first-id .. first-id+len-1.
  #   (Generated from BLOCKS layout table in schema generator.)
  - kind: RangeSyntax
    from: AttributeList       # 0x000
    to:   Attribute           # 0x002
    name: FirstAttributeFamily / LastAttributeFamily

  - kind: RangeSyntax
    from: ExternDecl          # 0x010
    to:   ExternVarDecl       # 0x014
    name: FirstFFIFamily / LastFFIFamily

  - kind: RangeSyntax
    from: UnitVariant         # 0x030
    to:   EnumVariantList     # 0x03C
    name: FirstEnumVariantFamily / LastEnumVariantFamily

  - kind: RangeSyntax
    from: StandaloneImplDecl  # kept as alias; actual range below
    to:   MarkerImpl
    name: FirstImplFamily / LastImplFamily

  - kind: RangeSyntax
    from: RestPattern         # 0x040
    to:   EnumPattern         # 0x04B
    name: FirstPatternFamily / LastPatternFamily

  - kind: RangeSyntax
    from: ErrorDefaultExpr    # 0x062
    to:   NoSubstitutionTemplateLiteralExpr # 0x06F
    name: FirstLiteralExprFamily / LastLiteralExprFamily

  - kind: RangeSyntax
    from: WherePred           # 0x080
    to:   StructLiteralExpr   # 0x097
    name: FirstExprFamily / LastExprFamily

  - kind: RangeSyntax
    from: DynTypeExpr         # 0x0C0
    to:   DynTypeAssocBindingList # 0x0D4
    name: FirstTypeFamily / LastTypeFamily

  - kind: RangeSyntax
    from: SuspendStatement    # 0x0E0
    to:   LetStmt             # 0x0EB
    name: FirstStmtFamily / LastStmtFamily

  - kind: RangeSyntax
    from: StandaloneImplDecl  # 0x0F0
    to:   FunctionParameterDecl  # 0x0F9
    name: FirstDeclFamily / LastDeclFamily

  # ── 3.2 Classification predicates (isExpr / isStmt / isDecl)
  - kind: Category
    name: isExpression
    includes:
      # Expr range (0x080..0x096)
      - WherePred
      - ThisExpr
      - IdentExpr
      - CallExpression
      - BinaryExpr
      - ConditionalExpr
      - AssignmentExpr
      - CommaExpr
      - MemberExpression
      - IndexExpression
      - NewExpression
      - FunctionExpression
      - ImportCallExpression
      - ObjectLiteralExpr
      - ObjectProperty
      - ObjectSpread
      - TemplateLiteralExpr
      - TypeOfExpression
      - UnaryExpression
      - PostfixExpression
      - CastExpression
      - LambdaExpression
      - SpawnExpression
      - StructLiteralExpr
      # Literal expressions count as expressions
      - ErrorDefaultExpr
      - NullCoalesceExpr
      - IsExpression
      - NullLiteral
      - BoolLiteral
      - IntLiteral
      - FloatLiteral
      - BigIntLiteral
      - StringLiteralExpr
      - ArrayLiteral
      - TupleLiteral
      - UnitLiteral
      - CharacterLiteralExpr
      - NoSubstitutionTemplateLiteralExpr
      # FFI expression-ish
      - UnsafeBlockExpr

  - kind: Category
    name: isStatement
    includes:
      # Stmt range (0x0E0..0x0EB)
      - SuspendStatement
      - BlockStmt
      - IfStmt
      - MatchStmt
      - WhileStmt
      - ForStmt
      - BreakStmt
      - ReturnStmt
      - StatementListItem
      - MatchArmStmt
      - LetStmt

  - kind: Category
    name: isNamedDeclaration
    includes:
      # Range nodes with bases=[NamedDeclaration]
      - ExternDecl
      - UnitVariant
      - TupleVariant
      - EnumDeclaration
      - ExternVarDecl
      - StandaloneImplDecl
      - MarkerImpl
      - FunctionDecl
      - ClassDecl
      - StructDecl
      - FunctionParameterDecl

  # ── 3.3 Reflection metadata (NodeSchema[SyntaxKind] → fieldName/offset/typeName)
  - kind: Reflection
    purpose: "Auto-generated for LSP hover + Debugger pretty-printer + serialization schema"

  # ── 3.4 G2 Disjoint-Category Ranges (generated from categories: block above)
  #    For every category listed in §2b (Attribute, FFI, EnumVariant, ...):
  #    kind: RangeSyntax → first_id=<category.first> last_id=<category.last>
  #    This produces `is<Category>Name(SyntaxKind)` constexpr predicates during codegen.
  #    Self-check 6 (§4.3) verifies non-overlap *before* these rows are expanded.

# ───────────────────────────────────────────────────────────
# 3b. G2 Well-Formedness Self-Checks (6 rules · runs before codegen)
# Documented in ast-data-structure.md §4.3. Modifying this list requires
# updating both the Python code generator implementation AND §4.3 listing
# AND the changelog. DO NOT edit silently.
# ───────────────────────────────────────────────────────────
self_checks:
  - id: sc1_variant_count_matches_enum
    severity: fatal            # any failure → codegen aborts
    applies_to: [variants, enums/SyntaxKind]
    rule: "len(variants) == len(SyntaxKind enum entries)"
    rationale: "Schema and generated enum must stay in lock-step; drift → silent UB on cast"

  - id: sc2_payload_fits_storage
    severity: fatal
    applies_to: [every variant.fields]
    rule: "payload word count ≤ storage.payload_words"
    rationale: "Every generated accessor and factory must fit the schema-owned NodePayload storage"

  - id: sc3_field_type_allowlist
    severity: fatal
    applies_to: [every field]
    rule: "field.type present in field_types: block (§4 below) OR is a generated enum"
    rationale: "Prevents P2/P4 violations (Own<T>, raw pointers, cross-Arena references) at schema-edit time"

  - id: sc4_cast_target_valid_and_category_compatible
    severity: fatal
    applies_to: [every field with cast:]
    rule: "cast target ∈ variants ∪ categories ∪ union_predicates  ∧  src_category ⊆ dst_category"
    rationale: "G2 rule 4 — catches typos and cross-category UB; typed variant traversal relies on subset relation. Category unions are allowed as cast targets and expand to their constituent concrete variants during the check."

  - id: sc5_named_decl_has_IdentId
    severity: warning          # warning so that draft schema with stub payloads can still generate
    applies_to: [variants with bases: [NamedDeclaration]]
    rule: "∃ at least one field with type = IdentId"
    rationale: "G2 rule 5 — nodes claiming to be NamedDeclarations must bind a name; IdentId field is the convention"

  - id: sc6_categories_disjoint
    severity: fatal
    applies_to: [categories block]
    rule: "∀ pairs (A, B) of categories: range(A) ∩ range(B) = ∅"
    rationale: "G2 rule 6 — RangeSyntax-derived predicates isExpr/isStmt/isDecl require non-overlapping ids"

# ───────────────────────────────────────────────────────────
# 3c. In-memory payload storage
# ───────────────────────────────────────────────────────────
storage:
  payload_words: 8

# ───────────────────────────────────────────────────────────
# 4. Field type lookup table (used by the code generator)
# ───────────────────────────────────────────────────────────
field_type_mapping:
  NodeId:         { cpp: "uint32_t", size: 4,  align: 4 }
  NodeList:       { cpp: "NodeList",       size: 8, align: 4, comment: "len≤2^16-1; oversized lists require splitting" }
  IdentList:      { cpp: "IdentList",      size: 8, align: 4, comment: "IdentId vector, same pack layout as NodeList" }
  IdentId:        { cpp: "uint32_t", size: 4,  align: 4 }
  StringId:       { cpp: "uint32_t", size: 4,  align: 4 }
  FloatId:        { cpp: "uint32_t", size: 4,  align: 4 }
  BigIntId:       { cpp: "uint32_t", size: 4,  align: 4 }
  bool:           { cpp: "bool",     size: 1,  align: 1, pack: "bitfield" }
  uint8:          { cpp: "uint8_t",  size: 1,  align: 1 }
  uint16:         { cpp: "uint16_t", size: 2,  align: 2 }
  uint32:         { cpp: "uint32_t", size: 4,  align: 4 }
  uint64:         { cpp: "uint64_t", size: 8,  align: 8 }
  Loc32:          { cpp: "::zomlang::compiler::source::Loc32", size: 4, align: 4, comment: "22b line + 10b column" }
  Abi:            { cpp: "Abi",       size: 2, align: 2 }
  WhereBoundKind: { cpp: "WhereBoundKind", size: 1, align: 1 }
  SuspendMode:    { cpp: "SuspendMode", size: 1, align: 1 }

  # G1 (ArenaBorrow §5.3): compiler-phase scope enum
  ArenaScope:     { cpp: "ArenaScope", size: 1, align: 1 }

