version: "2.0"
project: "zomlang"
status: "ACCEPTED"

# This file is the implementation-side source of truth for syntax node payloads.
# Generated files are emitted into products/zomlang/compiler/ast/generated/ and
# are compiled as part of the main ast target in namespace zomlang::compiler::ast.

enums:

  # §19 Conditional Compilation CfgOp
  CfgOpKind:
    type: uint8
    values: [ Eq, NotEq, And, Or, In, Contains, StartsWith, EndsWith ]

  # §20 FFI ABI convention
  Abi:
    type: uint16
    values: [ Cdecl, Stdcall, Fastcall, Swift, Rust, ZomNative, VarArgs ]

  # §21 Macros three brace shapes
  MacroBrace:
    type: uint8
    values: [ Paren, Brack, Brace ]

  # §19.8 CfgAtom value three forms
  CfgAtomValueKind:
    type: uint8
    values: [ None, String, Ident ]

  # §12 Generics · Where clause bound
  WhereBoundKind:
    type: uint8
    values: [ Lt, Le, Eq, Ne, Ge, Gt, Subtype, Implements, SendableMarker ]

  # §8 Struct extensibility (three-way choice, fully partitioned per §PATTERN-002)
  ClassExtensibility:
    type: uint8
    values: [ Sealed, Final, Open ]

  # §4.9 Concurrency · Detached modifier
  SuspendMode:
    type: uint8
    values: [ Bare, Until, OnTimeout ]

  ArenaScope:
    type: uint8
    values: [ Parser, Binder, Lowering ]

  MacroFragmentKind:
    type: uint8
    values: [ Ident, Expr, Ty, Stmt, Pat, Path, Item, Block, Meta, Literal, Lifetime, Vis, Tt, Token ]

  EnumReprKind:
    type: uint8
    values: [ I32, I8, I16, I64, U8, U16, U32, U64 ]

  LiteralPatternKind:
    type: uint8
    values: [ Integer, Float, BigInt, String, Char, Bool, Null ]

  UnaryOperatorKind:
    type: uint8
    values: [ Plus, Minus, LogicalNot, BitNot, Deref, Ref, PreIncrement, PreDecrement ]

  PostfixOperatorKind:
    type: uint8
    values: [ Increment, Decrement, ErrorPropagate, ErrorUnwrap ]

  BindingDeclarationKind:
    type: uint8
    values: [ Let, Mut, Const ]

  AssignmentOperatorKind:
    type: uint8
    values: [ Assign, AddAssign, SubAssign, MulAssign, DivAssign, ModAssign, PowAssign, ShlAssign, ShrAssign, UShrAssign, BitAndAssign, BitOrAssign, BitXorAssign, LogicalAndAssign, LogicalOrAssign, NullCoalesceAssign ]

  CaptureMode:
    type: uint8
    values: [ ByValue, ByRef, This ]

categories:
  Module:          { first: 0x170, last: 0x17F, desc: "source files and module paths" }
  Attribute:       { first: 0x00, last: 0x0F, desc: "§19 conditional / attribute" }
  FFI:             { first: 0x10, last: 0x1F, desc: "§20 extern / unsafe" }
  Macros:          { first: 0x20, last: 0x2F, desc: "§21 macro_rules / invocation" }
  EnumVariant:     { first: 0x30, last: 0x3F, desc: "§10 enum three-form variants" }
  Pattern:         { first: 0x40, last: 0x5F, desc: "§7 patterns (exhaustive match)" }
  LiteralExpr:     { first: 0x60, last: 0x7F, desc: "§4 literals + basic expressions" }
  Expr:            { first: 0x80, last: 0xBF, desc: "§4 expressions (RangeSyntax Expr union = LiteralExpr ∪ Expr)" }
  Type:            { first: 0xC0, last: 0xDF, desc: "§3 type expressions" }
  Statement:       { first: 0xE0, last: 0x10F, desc: "§5 statements" }
  Declaration:     { first: 0x110, last: 0x16F, desc: "§6 declarations" }
  TypeMember:      { first: 0x180, last: 0x18F, desc: "§3 structural type members" }

# ── G2 sc4 / sc6 augmentation: Category-Abstract Unions ──────────────────
# The names listed below are NOT concrete variant ids — they are UNION /
# SUPERSET predicates used only inside `cast:` target validations and the
# RangeSyntax classifier. They must NOT appear in any variant's `id:` field.
# Self-check 4 treats any cast target present in this list as a "sub-type"
# of the category that its name describes; the cross-category disjointness
# check (sc6) skips them (they are purposefully overlapping unions).
union_predicates:
  - Expression       # LiteralExpr ∪ Expr ∪ UnsafeBlockExpr ∪ MacroInvocationExpr ∪ ...
  - TypeExpr         # any variant whose id lies in Type [0xC0..0xDF]
  - Statement        # Statement category ∪ SuspendStatement expansion
  - Declaration      # Declaration category (see categories block above)
  - Pattern          # Pattern category
  - CfgPredicate     # CfgAtom ∪ CfgAll ∪ CfgAny ∪ CfgNot ∪ CfgOp
  - Identifier       # Named variant: IdentPath / IdentExpr / plain Identifier
  - BlockStmt        # BlockExpression (statement-as-expression block body)
  - TokenNode        # Leaf variants produced by the lexer (identifier tokens, literal terminal wrappers)
  - ParameterDecl    # FunctionParameterDecl / FFIParameterDecl union
  - TypeParamDecl    # Generic type parameter declaration variants
  - PropertyDecl     # Struct property declaration variants
  - ClassElement     # MethodDecl / FieldDecl / AssociatedTypeDecl union
  - PositionalFieldDecl # Positional struct / positional newtype field variants
  - ObjectLiteralElement # ObjectProperty / ObjectSpread union
# ───────────────────────────────────────────────────────────
variants:

# 0x170..0x17F Source / Module roots
  - id: 0x170
    name: SourceFile
    doc: "Compilation-unit root node"
    fields:
      - {name: file_name, type: StringId}
      - {name: module, type: NodeId, cast: ModuleDeclaration, optional: true}
      - {name: statements, type: NodeList, cast: StatementListItem}

  - id: 0x171
    name: ModulePath
    doc: "Qualified module path"
    fields:
      - {name: segments, type: IdentList}

  - id: 0x172
    name: ImportDeclaration
    doc: "import path[.{specifiers}] [as alias];"
    fields:
      - {name: path, type: NodeId, cast: ModulePath}
      - {name: alias, type: IdentId, optional: true}
      - {name: specifiers, type: NodeList, cast: ImportSpecifier, optional: true}

  - id: 0x173
    name: ExportDeclaration
    doc: "export declaration or export list"
    fields:
      - {name: declaration, type: NodeId, optional: true}
      - {name: path, type: NodeId, cast: ModulePath, optional: true}
      - {name: specifiers, type: NodeList, cast: ExportSpecifier, optional: true}

  - id: 0x174
    name: ImportSpecifier
    doc: "named import specifier"
    fields:
      - {name: name, type: IdentId}
      - {name: alias, type: IdentId, optional: true}

  - id: 0x175
    name: ExportSpecifier
    doc: "named export specifier"
    fields:
      - {name: name, type: IdentId}
      - {name: alias, type: IdentId, optional: true}

# 0x00..0x0F Attribute / Conditional (9)
  - id: 0x000
    name: AttributeList
    doc:  "Attr list (intrusive head+len)"
    fields:
      - {name: attrs, type: NodeList, cast: Attribute}

  - id: 0x001
    name: AttributePath
    doc:  "Attr path zom::cfg::unix / marker::Sendable (255 seg bound)"
    fields:
      - {name: segments, type: IdentList, maxlen: 255}
      - {name: leading, type: uint8, enum: ["None", Crate, Self, Super, Root]}

  - id: 0x002
    name: Attribute
    doc:  "General #[path(arg1, arg2)] attribute"
    fields:
      - {name: path, type: NodeId, cast: AttributePath}
      - {name: args, type: NodeList, cast: Expression}

  - id: 0x003
    name: ZomCfgAttribute
    doc:  "#[zom::cfg(pred)] dedicated conditional compilation node"
    fields:
      - {name: pred, type: NodeId, cast: CfgPredicate}

  - id: 0x004
    name: CfgAtom
    doc:  "Conditional atom: bare key / key = 'str' / key = IDENT"
    fields:
      - {name: key, type: NodeId, cast: AttributePath}
      - {name: vk, type: CfgAtomValueKind}
      - {name: value_or_id, type: uint64}

  - id: 0x005
    name: CfgAll
    doc:  "all(pred, pred, ...)"
    fields:
      - {name: preds, type: NodeList, cast: CfgPredicate}

  - id: 0x006
    name: CfgAny
    doc:  "any(pred, pred, ...)"
    fields:
      - {name: preds, type: NodeList, cast: CfgPredicate}

  - id: 0x007
    name: CfgNot
    doc:  "not(pred)"
    fields:
      - {name: inner, type: NodeId, cast: CfgPredicate}

  - id: 0x008
    name: CfgOp
    doc:  "Binary cfg comparison: == / != / in / contains / starts_with / ends_with"
    fields:
      - {name: op, type: CfgOpKind}
      - {name: lhs, type: NodeId}
      - {name: rhs, type: NodeId}

# 0x10..0x1F FFI / Unsafe (8)
  - id: 0x010
    name: ExternDecl
    bases: [NamedDeclaration]
    doc:  "extern fun name(params) -> Ret raises E;"
    fields:
      - {name: name, type: IdentId}
      - {name: abi, type: Abi, default: Cdecl}
      - {name: params, type: NodeList, cast: ParameterDecl}
      - {name: ret_ty, type: NodeId, cast: TypeExpr, optional: true}
      - {name: raises_ty, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x011
    name: UnsafeBlockExpr
    doc:  "unsafe { ... } boundary that MUST enclose FFI calls"
    fields:
      - {name: body, type: NodeId, cast: BlockStmt}

  - id: 0x012
    name: ExternBlock
    doc:  "extern 'ABI' { extern fun ... ; extern var ... }"
    fields:
      - {name: abi, type: Abi, default: Cdecl}
      - {name: items, type: NodeList}

  - id: 0x013
    name: FFIParameterDecl
    doc:  "extern fun parameter (distinct from generic ParameterDecl)"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: attrs, type: NodeId, cast: AttributeList, optional: true}

  - id: 0x014
    name: ExternVarDecl
    bases: [NamedDeclaration]
    doc:  "extern var name: T; — imported global"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: abi, type: Abi, default: Cdecl}
      - {name: is_mut, type: bool}

  - id: 0x015
    name: ExternStaticDecl
    bases: [NamedDeclaration]
    doc:  "extern static NAME: T = value;"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: abi, type: Abi, default: Cdecl}
      - {name: init, type: NodeId, cast: Expression, optional: true}

  - id: 0x016
    name: FFIConstDecl
    bases: [NamedDeclaration]
    doc:  "extern const NAME: T;"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: abi, type: Abi, default: Cdecl}

  - id: 0x017
    name: FFILinkSpec
    doc:  "Resolved link_name / link_section / align payload"
    fields:
      - {name: link_name, type: StringId, optional: true}
      - {name: link_section, type: StringId, optional: true}
      - {name: link_align, type: uint32, optional: true}

# 0x20..0x2F Macros (12)
  - id: 0x020
    name: MacroInvocationExpr
    doc:  "foo!(...) / foo![...] / foo!{...}"
    fields:
      - {name: name, type: NodeId, cast: Identifier}
      - {name: brace, type: MacroBrace}
      - {name: tt, type: NodeList}

  - id: 0x021
    name: MacroRulesDecl
    bases: [NamedDeclaration]
    doc:  "macro_rules! name { pattern => expansion ; ... }"
    fields:
      - {name: name, type: IdentId}
      - {name: rules, type: NodeList, cast: MacroRule}

  - id: 0x022
    name: MacroRule
    doc:  "Single match arm: matcher to expansion"
    fields:
      - {name: pattern, type: NodeId, cast: MacroPattern}
      - {name: expand, type: NodeId, cast: MacroTokenTree}

  - id: 0x023
    name: MacroPattern
    doc:  "matcher: $i:ident $(, $rest:expr),*"
    fields:
      - {name: frags, type: NodeList, cast: MacroFragment}

  - id: 0x024
    name: MacroFragment
    doc:  "Fragment kind: ident/expr/ty/stmt/pat (14 kinds)"
    fields:
      - {name: binding_name, type: IdentId, optional: true}
      - {name: frag_kind, type: uint8, enum: MacroFragmentKind}
      - {name: is_repetition, type: bool}
      - {name: sep, type: uint8, enum: ["None", Comma, Semicolon, Colon]}

  - id: 0x025
    name: MacroTokenTree
    doc:  "Expand-side nestable token tree"
    fields:
      - {name: tokens, type: NodeList, cast: TokenNode}

  - id: 0x026
    name: DeriveList
    doc:  "#[derive(Debug, Clone, Hash)]"
    fields:
      - {name: items, type: NodeList, cast: DeriveItem}

  - id: 0x027
    name: DeriveItem
    doc:  "Single trait derive name + optional args"
    fields:
      - {name: trait_path, type: NodeId, cast: AttributePath}
      - {name: args, type: NodeList, cast: Expression, optional: true}

  - id: 0x028
    name: MacroQuasiQuote
    doc:  "#(...) quasi-quote inside macro expansion body"
    fields:
      - {name: depth, type: uint8}
      - {name: body, type: NodeId, cast: MacroTokenTree}

  - id: 0x029
    name: MacroUnquote
    doc:  "$id / $(expr) unquote in quasi-quoted tree"
    fields:
      - {name: expr, type: NodeId, cast: Expression}

  - id: 0x02A
    name: MacroDelimitedGroup
    doc:  "Delimited token group preserved for hygiene"
    fields:
      - {name: brace, type: MacroBrace}
      - {name: tokens, type: NodeList, cast: TokenNode}

  - id: 0x02B
    name: ProcMacroDecl
    bases: [NamedDeclaration]
    doc:  "proc_macro fun name(tt) -> TokenStream;"
    fields:
      - {name: name, type: IdentId}
      - {name: kind, type: uint8, enum: [Bang, Attr, Derive]}
      - {name: params, type: NodeList, cast: ParameterDecl}
      - {name: attributes, type: NodeId, cast: AttributeList, optional: true}

# 0x30..0x3F Enum Variants (13)
  - id: 0x030
    name: UnitVariant
    bases: [DeclarationStatement]
    doc:  "enum E { Plain = 1 } (no fields, optional discriminant)"
    fields:
      - {name: name, type: IdentId}
      - {name: has_disc, type: bool}
      - {name: disc, type: BigIntId, optional: true}

  - id: 0x031
    name: TupleVariant
    bases: [DeclarationStatement]
    doc:  "enum E { Color(u8, u8, u8) } (positional fields)"
    fields:
      - {name: name, type: IdentId}
      - {name: nfields, type: uint16}
      - {name: tys, type: NodeList, cast: TypeExpr}
      - {name: has_disc, type: bool}
      - {name: disc, type: BigIntId, optional: true}

  - id: 0x032
    name: StructVariant
    bases: [DeclarationStatement]
    doc:  "enum E { Point { x: i32, y: i32 } } (named fields)"
    fields:
      - {name: name, type: IdentId}
      - {name: nfields, type: uint16}
      - {name: fields, type: NodeList, cast: PropertyDecl}
      - {name: has_disc, type: bool}
      - {name: disc, type: BigIntId, optional: true}

  - id: 0x033
    name: EnumDeclaration
    bases: [NamedDeclaration]
    doc:  "Enum declaration (supports mixed three-variant declarations)"
    fields:
      - {name: name, type: IdentId}
      - {name: extensibility, type: ClassExtensibility}
      - {name: type_params_id, type: NodeId, cast: GenericParams, optional: true}
      - {name: nvars, type: uint16}
      - {name: variants_id, type: NodeId, cast: EnumVariantList}
      - {name: base_repr, type: uint8, enum: EnumReprKind, default: I32}

  - id: 0x03C
    name: EnumVariantList
    doc:  "Container for enum variant nodes (keeps EnumDecl payload ≤24B)"
    fields:
      - {name: nvars, type: uint16}
      - {name: variants, type: NodeList}

  - id: 0x034
    name: AssociatedConstVariant
    doc:  "Variant-level associated const discriminant"
    fields:
      - {name: name, type: IdentId}
      - {name: const_expr, type: NodeId, cast: Expression}
      - {name: has_disc, type: bool}
      - {name: disc, type: BigIntId, optional: true}

  - id: 0x035
    name: EnumMemberAlias
    doc:  "Variant alias: enum E { X = Y }"
    fields:
      - {name: name, type: IdentId}
      - {name: target_path, type: NodeId, cast: Identifier}

  - id: 0x036
    name: EnumVariantAttr
    doc:  "Attributes attached to a single enum member"
    fields:
      - {name: attrs, type: NodeId, cast: AttributeList}
      - {name: variant, type: NodeId}

  - id: 0x037
    name: DiscriminantRef
    doc:  "Explicit discriminant synthesized during lowering"
    fields:
      - {name: owner_enum, type: NodeId, cast: EnumDeclaration}
      - {name: variant_index, type: uint32}

  - id: 0x038
    name: EnumExtendsClause
    doc:  "enum E : u16 { ... } explicit base-repr clause"
    fields:
      - {name: base_ty, type: NodeId, cast: TypeExpr}
      - {name: is_explicit, type: bool}

  - id: 0x039
    name: RawVariant
    doc:  "Raw union variant — one untagged field for FFI unions"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr}

  - id: 0x03A
    name: EnumReprAttr
    doc:  "Expanded #[repr(IntKind)] payload on EnumDeclaration"
    fields:
      - {name: repr_kind, type: uint8, enum: EnumReprKind, default: I32}
      - {name: is_explicit, type: bool}

# 0x40..0x5F Patterns (20)
  - id: 0x040
    name: RestPattern
    doc:  "...rest / ... (tail binding in Tuple/Struct/Array/Object)"
    fields:
      - {name: binding, type: IdentId, optional: true}

  - id: 0x041
    name: LiteralPattern
    doc:  "Literal pattern in match arm (numeric / char / string / bool / null)"
    fields:
      - {name: literal, type: NodeId, cast: Expression}

  - id: 0x042
    name: IsPattern
    doc:  "expr is Type — pattern-level is"
    fields:
      - {name: ty, type: NodeId, cast: TypeExpr}

  - id: 0x043
    name: WildcardPattern
    doc:  "_ wildcard (irrefutable)"
    fields:
      - {name: ty, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x044
    name: BindingPattern
    doc:  "name @ pattern bind + sub-pattern"
    fields:
      - {name: name, type: IdentId}
      - {name: is_mut, type: bool}
      - {name: is_ref, type: bool}
      - {name: sub, type: NodeId, cast: Pattern, optional: true}

  - id: 0x045
    name: IdentifierPattern
    doc:  "Single binding identifier (always irrefutable)"
    fields:
      - {name: name, type: IdentId}
      - {name: ty, type: NodeId, cast: TypeExpr, optional: true}

  - id: 0x046
    name: TuplePattern
    doc:  "(p1, p2, ..pn) tuple destructuring"
    fields:
      - {name: pats, type: NodeList, cast: Pattern}

  - id: 0x047
    name: StructPattern
    doc:  "Type { field: pat, ..rest } destructuring"
    fields:
      - {name: ty_path, type: NodeId, cast: Identifier, optional: true}
      - {name: fields, type: NodeList, cast: PatternProperty}
      - {name: rest, type: NodeId, cast: RestPattern, optional: true}

  - id: 0x048
    name: PatternProperty
    doc:  "Single field inside struct/object pattern"
    fields:
      - {name: name, type: IdentId}
      - {name: short_form, type: bool}
      - {name: pat, type: NodeId, cast: Pattern, optional: true}

  - id: 0x049
    name: ArrayPattern
    doc:  "[p0, p1, ..rest] fixed-width array destructuring"
    fields:
      - {name: pats, type: NodeList, cast: Pattern}
      - {name: rest, type: NodeId, cast: RestPattern, optional: true}

  - id: 0x04A
    name: ExpressionPattern
    doc:  "Expression used as a pattern discriminator"
    fields:
      - {name: expr, type: NodeId, cast: Expression}

  - id: 0x04B
    name: EnumPattern
    doc:  "Enum variant pattern such as Result.Ok(value)"
    fields:
      - {name: path, type: NodeId, cast: ModulePath}
      - {name: args, type: NodeList, cast: Pattern}

# 0x60..0x7F Literal / Leaf Expressions (25)
  - id: 0x060
    name: PositionalStructCtorExpr
    doc:  "Foo(1, 2, 3) positional struct constructor"
    fields:
      - {name: struct_path, type: NodeId, cast: Identifier}
      - {name: nargs, type: uint16}
      - {name: args, type: NodeList, cast: Expression}

  - id: 0x061
    name: TupleLiteral1
    doc:  "(a,) forced 1-tuple (disambiguated vs ParenthesizedExpr)"
    fields:
      - {name: elem, type: NodeId, cast: Expression}

  - id: 0x062
    name: ErrorDefaultExpr
    doc:  "a ?: fallback error-default operator"
    fields:
      - {name: primary, type: NodeId, cast: Expression}
      - {name: fallback, type: NodeId, cast: Expression}

  - id: 0x063
    name: NullCoalesceExpr
    doc:  "a ?? fallback null coalesce"
    fields:
      - {name: primary, type: NodeId, cast: Expression}
      - {name: fallback, type: NodeId, cast: Expression}

  - id: 0x064
    name: IsExpression
    doc:  "expr is TypeExpr (strict type test, does not trigger coerce)"
    fields:
      - {name: expr, type: NodeId, cast: Expression}
      - {name: ty, type: NodeId, cast: TypeExpr}

  - id: 0x065
    name: NullLiteral
    doc:  "null literal (inhabits the null type)"
    fields:
      []

  - id: 0x066
    name: BoolLiteral
    doc:  "true / false literal"
    fields:
      - {name: value, type: bool}

  - id: 0x067
    name: IntLiteral
    doc:  "Arbitrary base integer literal"
    fields:
      - {name: base, type: uint8}
      - {name: value, type: BigIntId}

  - id: 0x068
    name: FloatLiteralExpr
    doc:  "IEEE-754 floating-point literal"
    fields:
      - {name: width, type: uint8}
      - {name: value, type: FloatId}

  - id: 0x069
    name: BigIntLiteral
    doc:  "123n arbitrary-precision big integer literal"
    fields:
      - {name: value, type: BigIntId}

  - id: 0x06A
    name: StrLiteral
    doc:  "Double-quoted string (supports escapes)"
    fields:
      - {name: value, type: StringId}
      - {name: is_raw, type: bool}
      - {name: prefix, type: uint8, enum: ["None", f, r, b, br]}

  - id: 0x06B
    name: ArrayLiteral
    doc:  "[a, b, c] array literal"
    fields:
      - {name: elems, type: NodeList, cast: Expression}

  - id: 0x06C
    name: TupleLiteral
    doc:  "() / (a, b, c) n-ary tuple literal"
    fields:
      - {name: elems, type: NodeList, cast: Expression}

  - id: 0x06D
    name: UnitLiteral
    doc:  "unit literal expression"
    fields:
      []

# 0x80..0xBF Expressions (46)
  - id: 0x080
    name: WherePred
    doc:  "Single where predicate (Subtype / Implements / SendableMarker)"
    fields:
      - {name: kind, type: WhereBoundKind}
      - {name: ty, type: NodeId, cast: TypeExpr}
      - {name: bound, type: NodeId, cast: TypeExpr}

  - id: 0x081
    name: ThisExpr
    doc:  "this receiver in class/struct methods"
    fields:
      []

  - id: 0x082
    name: IdentExpr
    doc:  "Plain identifier in expression position"
    fields:
      - {name: name, type: IdentId}

  - id: 0x083
    name: CallExpression
    doc:  "callee(a1, a2, ...) general call"
    fields:
      - {name: callee, type: NodeId, cast: Expression}
      - {name: type_args, type: NodeList, cast: TypeExpr, optional: true}
      - {name: args, type: NodeList, cast: Expression}

  - id: 0x084
    name: BinaryExpr
    doc:  "Arithmetic / bitwise / logical / relational op"
    fields:
      - {name: op, type: uint16, enum: [Add, Sub, Mul, Div, Mod, Pow, Shl, Shr, UShr, BitAnd, BitOr, BitXor, LogAnd, LogOr, Eq, Ne, StrictEq, StrictNe, Lt, Le, Gt, Ge]}
