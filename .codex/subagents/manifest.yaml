# Subagent manifest for ZOM AI Prompt system
#
# This file is the single register of all ZOM subagents. Adding a subagent
# means: (1) create <id>.md in this directory, (2) add its row to this
# manifest, (3) add its trigger rules to README.md routing table.
#
# id:           machine id, matches filename <id>.md and is what `Agent` /
#               `Workflow` tool calls use as `subagent_type`.
# name:         short human-readable label.
# owns:         path globs this subagent is the designated owner of.
#               A subagent may own zero globs (pure-review subagents) but
#               every source path in the repo must be covered by at least
#               one owner row somewhere in this manifest.
# triggers:     keywords that, when they appear in a user message, make
#               the task-router suggest routing to this subagent.
# required-skills: skill names (without the /SKILL.md suffix) this subagent
#               automatically pulls in when spawned.
# escalation-to: subagent id(s) to pass unresolved work to.
#
# If you edit this file, also sync the mermaid routing diagram in README.md.

subagents:
  - id: task-router
    name: Task Router
    owns:
      - ".codex/subagents/**"
      - "AGENTS.md"
    triggers: [ "route", "assign", "split", "owner", "delegate", "task split", "workflow", "forced cast", "as!" ]
    required-skills: [ build-ci ]
    escalation-to: [ spec-audit ]

  - id: rfc
    name: RFC Governance
    owns:
      - "docs/rfc/**"
      - ".codex/skills/rfc/**"
    triggers: [ "RFC", "rfc", "proposal", "design intake", "governance", "template", "status transition", "accepted design", "prior art" ]
    required-skills: [ rfc ]
    escalation-to: [ spec-audit ]

  - id: lexer-parser
    name: Lexer & Parser
    owns:
      - "compiler/lexer/**"
      - "compiler/parser/**"
      - "compiler/ast/**"
      - "docs/spec/chapters/02-lexical-structure.md"
      - "docs/spec/chapters/04-expressions.md"
      - "docs/spec/chapters/17-grammar-reference.md"
      - "docs/spec/ZomLexer.g4"
      - "docs/spec/ZomParser.g4"
    triggers: [ "lexer", "token", "parser", "grammar", "precedence", "operator", "keyword", "EBNF", "cast", "as!", "?!", "!!" ]
    required-skills: [ build-ci, lit-testing, spec-alignment, zc-library ]
    escalation-to: [ spec-audit ]

  - id: binder-checker
    name: Binder & Type Checker
    owns:
      - "compiler/binder/**"
      - "!compiler/binder/module-*"
      - "compiler/checker/**"
      - "!compiler/checker/checker-source-diagnostics.def"
      - "compiler/type/**"
      - "docs/spec/chapters/03-types.md"
      - "docs/spec/chapters/06-declarations.md"
      - "docs/spec/chapters/08-classes-and-structures.md"
      - "docs/spec/chapters/09-interfaces.md"
      - "docs/spec/chapters/10-enumerations.md"
      - "docs/spec/chapters/12-generics.md"
      - "docs/spec/chapters/22-orphan-rule-and-coherence.md"
    triggers: [ "binder", "scope", "lookup", "type", "checker", "trait", "generic", "polymorphism", "cast", "as!", "Sendable", "Send", "Sync" ]
    required-skills: [ build-ci, lit-testing, zc-library ]
    escalation-to: [ verification ]

  - id: module-system
    name: Module System & Visibility
    owns:
      - "compiler/identity/**"
      - "compiler/query/**"
      - "compiler/source/**"
      - "compiler/binder/module-*"
      - "compiler/driver/**"
      - "core/Zom.toml"
      - "docs/spec/chapters/13-modules-and-imports.md"
      - "docs/spec/chapters/23-visibility-ladder.md"
    triggers: [ "identity", "brand", "source provenance", "SourceFileId", "ModuleId", "DefId", "module", "import", "export", "visibility", "package", "session", "CompilerSession", "cross-module", "query", "incremental", "red-green", "memo", "demand-driven" ]
    required-skills: [ build-ci, lit-testing, spec-alignment ]
    escalation-to: [ spec-audit ]

  - id: error-system
    name: Error System & Diagnostics
    owns:
      - "compiler/diagnostics/**"
      - "compiler/checker/checker-source-diagnostics.def"
      - "docs/spec/chapters/11-error-handling.md"
    triggers: [ "error", "diagnostic", "raises", "try", "exception", "panic", "cast", "as!", "ZOM", "?!", "!!", "propagat" ]
    required-skills: [ build-ci, lit-testing, spec-alignment ]
    escalation-to: [ lexer-parser, binder-checker ]

  - id: concurrency
    name: Concurrency & Async Runtime
    owns:
      - "runtime/**/task*"
      - "runtime/**/async*"
      - "runtime/**/actor*"
      - "runtime/**/channel*"
      - "runtime/**/scheduler*"
      - "docs/concurrency/**"
      - "docs/spec/specification.md"
      - "docs/spec/chapters/15-concurrency.md"
    triggers: [ "async", "await", "concurr", "actor", "sendable", "task", "future", "channel", "cancel", "parallel", "asynchronous", "forced cast", "as!" ]
    required-skills: [ build-ci, zc-library, lit-testing, ultracode-audit ]
    escalation-to: [ runtime-memory, verification ]

  - id: ir-backend
    name: Intermediate Representations & Native Backend
    owns:
      - "compiler/hir/**"
      - "compiler/ir/**"
      - "compiler/mir/**"
      - "compiler/lir/**"
      - "compiler/backend/**"
      - "compiler/basic/compiler-opts.h"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "compiler/CMakeLists.txt"
      - "compiler/basic/CMakeLists.txt"
      - "compiler/trace/CMakeLists.txt"
      - "utils/CMakeLists.txt"
      - "utils/zomc/**"
      - "core/CMakeLists.txt"
    triggers: [ "IR", "HIR", "MIR", "LIR", "SSA", "CFG", "lowering", "codegen", "backend", "LLVM", "ABI", "object file", "forced cast", "as!" ]
    required-skills: [ build-ci, zc-library, lit-testing ]
    escalation-to: [ binder-checker, module-system, error-system, concurrency, runtime-memory, verification, spec-audit ]

  - id: spec-audit
    name: Spec Alignment & Spec/Impl Drift
    owns:
      - "docs/overview.md"
      - "docs/spec/**"
      - "docs/design/**"
      - "!docs/design/tooling/**"
      - "docs/reports/*spec-alignment*"
    triggers: [ "spec", "grammar-ref", "align", "drift", "EBNF", "five-way", "audit", "cast", "as!" ]
    required-skills: [ spec-alignment, ultracode-audit, build-ci ]
    escalation-to: []

  - id: runtime-memory
    name: Runtime & Memory (zc core + FFI + ownership)
    owns:
      - "libraries/zc/**"
      - "compiler/ownership/**"
      - "runtime/**"
      - "!runtime/**/task*"
      - "!runtime/**/async*"
      - "!runtime/**/actor*"
      - "!runtime/**/channel*"
      - "!runtime/**/scheduler*"
      - "core/README.md"
      - "core/src/**"
      - "docs/spec/chapters/14-memory-management.md"
    triggers: [ "zc::", "Own<", "ArrayPtr", "Vector", "String", "Maybe", "memory", "heap", "stack", "drop", "free", "FFI", "Pimpl", "ownership", "panic", "forced cast", "as!" ]
    required-skills: [ zc-library, build-ci ]
    escalation-to: [ verification ]

  - id: tooling-lsp
    name: IDE Semantics & Language Server
    owns:
      - "tools/ide/**"
      - "tools/lsp/**"
      - "editors/**"
      - "docs/design/tooling/**"
    triggers: [ "LSP", "language server", "IDE", "hover", "completion", "signature help", "go to definition", "references", "rename", "semantic tokens", "inlay hints", "code action", "document version", "stale response" ]
    required-skills: [ build-ci, zc-library ]
    escalation-to: [ lexer-parser, binder-checker, module-system, error-system, verification ]

  - id: verification
    name: Formal-ish Verification & Test Coverage
    owns:
      - "tests/**"
      - "tests/cmake/expect-compile-failure/CMakeLists.txt"
      - "tests/compile-fail/query-runtime/**"
      - "tests/unittests/compiler/query/query-test-specs.h"
      - "tests/unittests/compiler/query/query-concurrency-test.cc"
      - "examples/**"
      - ".github/workflows/**"
      - "README.md"
      - "docs/reports/*coverage*"
      - "scripts/check-identity-architecture.py"
      - "scripts/check-ir-architecture.py"
      - "scripts/check-incremental-query-architecture.py"
      - "scripts/check-binder-architecture.py"
      - "scripts/check-stable-binding-schema.py"
      - "scripts/check-landing-scope.py"
      - "scripts/check-checker-architecture.py"
      - "scripts/check-compiler-session-architecture.py"
      - "scripts/check-impl-source-architecture.py"
      - "scripts/check-package-architecture.py"
      - "scripts/check-lexer-architecture.py"
      - "scripts/check-parser-coverage.py"
      - "scripts/check-format.py"
      - "scripts/check-english-only.py"
      - "scripts/check-spec-alignment.py"
      - "scripts/check-rfc.py"
      - "scripts/check-no-internal-versioning.py"
      - "scripts/codegen/gen_ast.py"
      - "scripts/codegen/gen_package_oracles.py"
      - "scripts/generate-canonical-header-syntax-schema.py"
      - "scripts/generate-query-descriptor-schema.py"
      - "scripts/check-query-descriptor-architecture.py"
      - "scripts/run-incremental-query-benchmarks.py"
      - "scripts/check-diagnostic-coverage.py"
      - "scripts/check-lit-exec-root.py"
      - "scripts/check-core-library-architecture.py"
      - "scripts/check-core-library-spec-alignment.py"
      - "scripts/codegen/gen_core_library_inventory.py"
      - "tests/coverage/diagnostic-reservations.json"
      - "scripts/run-rfc0016-coverage.py"
      - "scripts/check-rfc0016-coverage.py"
      - "scripts/check-ownership-architecture.py"
      - "scripts/run-ownership-coverage.py"
      - "scripts/check-ownership-coverage.py"
      - "tests/coverage/ownership-exemptions.json"
      - "tests/performance/incremental-query-corpus.json"
      - "tests/performance/incremental-query-baseline.json"
      - "cmake/utils/common.cmake"
      - "cmake/utils/coverage.cmake"
      - "cmake/utils/unittests.cmake"
    triggers: [ "test", "coverage", "lit", "FileCheck", "ztest", "fuzz", "XFAIL", "regen", "verify", "prove", "cast", "as!", "incremental query gate", "query benchmark", "projection shielding", "negative compile", "request decoder", "race gate", "identity-site provenance" ]
    required-skills: [ build-ci, lit-testing ]
    escalation-to: [ spec-audit ]
