name: ZOM CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release
  CLANG_FORMAT_VERSION: 20.1.8
  ANTLR_VERSION: 4.13.2
  ANTLR_SHA256: eae2dfa119a64327444672aff63e9ec35a20180dc5b8090b7a6ab85125df4d76
  ANTLRJAR: /tmp/antlr-4.13.2-complete.jar

jobs:
  check-rfc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Check RFC metadata
        run: python3 scripts/check-rfc.py

  check-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          curl -Lo clang-format.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.CLANG_FORMAT_VERSION }}/LLVM-${{ env.CLANG_FORMAT_VERSION }}-Linux-X64.tar.xz

          mkdir -p /tmp/clang-format
          tar -xf clang-format.tar.xz --wildcards --strip-components=1 -C /tmp/clang-format 'LLVM*/bin/clang-format'

          echo "/tmp/clang-format/bin" >> $GITHUB_PATH

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Check Code Format
        run: |
          clang-format --version
          python3 scripts/check-format.py

  check-unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang
          pip3 install lit psutil PyYAML

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install bash cmake ninja lit
          pip3 install --break-system-packages psutil PyYAML

      - name: Install pinned ANTLR grammar oracle
        run: |
          curl -L --fail --output "${ANTLRJAR}" \
            "https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar"
          printf '%s  %s\n' "${ANTLR_SHA256}" "${ANTLRJAR}" | shasum -a 256 --check

      - name: Configure CMake
        run: cmake --preset debug

      - name: Build tests
        run: cmake --build --preset debug

      - name: Run tests
        run: ctest --preset debug

  check-linux-sandbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang
          pip3 install lit psutil PyYAML

      - name: Configure sanitizer sandbox gate
        run: |
          cmake --preset sanitizer \
            -DZOM_ENABLE_PRIVILEGED_LINUX_SANDBOX_TESTS=ON

      - name: Build sanitizer sandbox gate
        run: |
          cmake --build --preset sanitizer \
            --target linux-native-sandbox-integration-test -j2

      - name: Run production sandbox in delegated cgroup
        run: scripts/run-linux-sandbox-integration.sh build-sanitizer

  generate-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lcov llvm
          pip3 install lit psutil PyYAML

      - name: Configure CMake
        run: cmake --preset coverage

      - name: Build tests
        run: cmake --build --preset coverage --target all

      - name: Generate coverage report
        run: cmake --build --preset coverage --target coverage

      - name: Fix coverage paths for codecov
        run: |
          # Fix absolute paths in lcov file to be relative to project root
          sed -i "s|SF:${{github.workspace}}/|SF:|g" build-coverage/coverage/coverage.lcov
          # Verify the file exists and has content
          ls -la build-coverage/coverage/coverage.lcov
          echo "First 10 lines of coverage file:"
          head -10 build-coverage/coverage/coverage.lcov
          echo "Coverage file size: $(wc -l < build-coverage/coverage/coverage.lcov) lines"

      - name: Validate coverage data
        run: |
          # Check if coverage file is not empty
          if [ ! -s build-coverage/coverage/coverage.lcov ]; then
            echo "Error: Coverage file is empty or does not exist"
            exit 1
          fi
          # Check if coverage file contains valid lcov data
          if ! grep -q "^SF:" build-coverage/coverage/coverage.lcov; then
            echo "Error: Coverage file does not contain valid lcov data"
            exit 1
          fi
          echo "Coverage file validation passed"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Zzzode/ZOM
          files: ${{github.workspace}}/build-coverage/coverage/coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
