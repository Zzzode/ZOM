name: ZOM CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release
  CLANG_FORMAT_VERSION: 20.1.8
  ANTLR_VERSION: 4.13.2
  ANTLR_SHA256: eae2dfa119a64327444672aff63e9ec35a20180dc5b8090b7a6ab85125df4d76
  ANTLRJAR: /tmp/antlr-4.13.2-complete.jar
  # Locked LLVM backend dependency (strategy B, self-managed source lock). The
  # source of truth is third_party/llvm/llvm-lock.json; these pins mirror it and
  # are cross-checked by scripts/check-llvm-lock.py against cmake/utils/llvm.cmake.
  LLVM_VERSION: 22.1.8
  LLVM_COMMIT: ca7933e47d3a3451d81e72ac174dcb5aa28b59d1

jobs:
  check-internal-versioning:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Check internal contracts are unversioned
        run: |
          python3 scripts/check-no-internal-versioning.py --self-test
          python3 scripts/check-no-internal-versioning.py --check

  check-rfc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Check RFC metadata
        run: python3 scripts/check-rfc.py

  check-english-only:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Check English-only gate
        run: |
          python3 scripts/check-english-only.py --self-test
          python3 scripts/check-english-only.py --check

  check-diff-hygiene:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Check diff hygiene
        run: |
          python3 scripts/check-diff-hygiene.py --self-test
          python3 scripts/check-diff-hygiene.py --check

  check-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          curl -Lo clang-format.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.CLANG_FORMAT_VERSION }}/LLVM-${{ env.CLANG_FORMAT_VERSION }}-Linux-X64.tar.xz

          mkdir -p /tmp/clang-format
          tar -xf clang-format.tar.xz --wildcards --strip-components=1 -C /tmp/clang-format 'LLVM*/bin/clang-format'

          echo "/tmp/clang-format/bin" >> $GITHUB_PATH

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Check Code Format
        run: |
          clang-format --version
          python3 scripts/check-format.py

  check-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_jobs: 8
          - os: macos-latest
            test_jobs: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang
          pip3 install lit psutil PyYAML

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install bash cmake ninja lit
          pip3 install --break-system-packages psutil PyYAML

      - name: Install pinned ANTLR grammar oracle
        run: |
          curl -L --fail --output "${ANTLRJAR}" \
            "https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar"
          printf '%s  %s\n' "${ANTLR_SHA256}" "${ANTLRJAR}" | shasum -a 256 --check

      - name: Configure CMake
        run: cmake --preset debug

      - name: Build tests
        run: cmake --build --preset debug

      - name: Run tests
        run: ctest --preset debug --parallel ${{ matrix.test_jobs }}

  check-linux-sandbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang
          pip3 install lit psutil PyYAML

      - name: Configure sanitizer sandbox gate
        run: |
          cmake --preset sanitizer \
            -DZOM_ENABLE_PRIVILEGED_LINUX_SANDBOX_TESTS=ON

      - name: Build sanitizer sandbox gate
        run: |
          cmake --build --preset sanitizer \
            --target package-linux-native-sandbox-integration-test -j2

      - name: Run production sandbox in delegated cgroup
        run: scripts/run-linux-sandbox-integration.sh build-sanitizer

  generate-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lcov llvm
          pip3 install lit psutil PyYAML

      - name: Configure CMake
        run: cmake --preset coverage

      - name: Build tests
        run: cmake --build --preset coverage --target all

      - name: Generate coverage report
        run: cmake --build --preset coverage --target coverage

      - name: Fix coverage paths for codecov
        run: |
          # Fix absolute paths in lcov file to be relative to project root
          sed -i "s|SF:${{github.workspace}}/|SF:|g" build-coverage/coverage/coverage.lcov
          # Verify the file exists and has content
          ls -la build-coverage/coverage/coverage.lcov
          echo "First 10 lines of coverage file:"
          head -10 build-coverage/coverage/coverage.lcov
          echo "Coverage file size: $(wc -l < build-coverage/coverage/coverage.lcov) lines"

      - name: Validate coverage data
        run: |
          # Check if coverage file is not empty
          if [ ! -s build-coverage/coverage/coverage.lcov ]; then
            echo "Error: Coverage file is empty or does not exist"
            exit 1
          fi
          # Check if coverage file contains valid lcov data
          if ! grep -q "^SF:" build-coverage/coverage/coverage.lcov; then
            echo "Error: Coverage file does not contain valid lcov data"
            exit 1
          fi
          echo "Coverage file validation passed"

      - name: Generate ownership coverage report
        run: python3 scripts/run-ownership-coverage.py

      - name: Check ownership coverage floor and baseline
        run: |
          python3 scripts/check-ownership-coverage.py --self-test
          python3 scripts/check-ownership-coverage.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Zzzode/ZOM
          files: ${{github.workspace}}/build-coverage/coverage/coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true

  # RFC 0016 / O2-KR2.5 -- LLVM backend gate. This is the ONLY job that enables
  # ZOM_ENABLE_LLVM_BACKEND; every frontend job above leaves it OFF and links no
  # LLVM, so the frontend contract stays fast and LLVM-free.
  #
  # Runner is fixed to ubuntu-24.04 per the RFC 0016 contract. That image ships
  # glibc 2.39, which clears the glibc floor of a commit-locked prebuilt LLVM
  # (the host-of-record dev build was glibc 2.36; a glibc-2.38 prebuilt would not
  # run there, which is why the lock owns the source). CI provisions the SAME
  # commit-locked LLVM as dev: it restores a cached prebuilt keyed on LLVM_COMMIT
  # and falls back to scripts/provision-llvm.py (from-source) on a cache miss.
  check-backend-llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang git
          pip3 install lit psutil PyYAML

      - name: Verify LLVM lock matches the CMake gate
        run: python3 scripts/check-llvm-lock.py

      # Cache the provisioned LLVM prefix keyed on the locked commit + runner OS,
      # so the commit-locked toolchain is reused rather than rebuilt every run.
      - name: Cache locked LLVM prefix
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm22
          key: llvm-${{ runner.os }}-${{ env.LLVM_COMMIT }}

      # On a cache miss, build the locked tag from source. The helper is
      # idempotent: on a cache hit it detects the valid install and skips.
      - name: Provision locked LLVM (from source on cache miss)
        run: python3 scripts/provision-llvm.py --prefix "$HOME/toolchains/llvm22"

      - name: Configure with LLVM backend enabled
        run: |
          cmake --preset llvm \
            -DLLVM_DIR="$HOME/toolchains/llvm22/lib/cmake/llvm"

      - name: Run RFC 0016 discovery-gate fixtures
        run: |
          python3 tests/tools/check-llvm-discovery-gate.py \
            --harness-dir tests/cmake/llvm-discovery-gate \
            --gate-module cmake/utils/llvm.cmake \
            --real-llvm-dir "$HOME/toolchains/llvm22/lib/cmake/llvm"

      - name: Build backend translation test
        run: cmake --build build-llvm --target llvm-translation-test

      - name: Run backend translation test
        run: ctest --test-dir build-llvm --output-on-failure -R llvm-translation-test

  # TODO(O2-KR2.5): add the macos-15 backend lane (RFC 0016 desirable target).
  # Deferred here because a from-source LLVM build on macOS CI is heavy and this
  # change cannot validate a macOS runner in-session. The Linux ubuntu-24.04
  # lane above is the honest partial; the macOS lane must reuse the same
  # commit-locked source (scripts/provision-llvm.py) rather than a rolling
  # Homebrew install, per the strategy-B source-of-truth contract.
