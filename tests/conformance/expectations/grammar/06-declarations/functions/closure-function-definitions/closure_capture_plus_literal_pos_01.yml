section: "§4 FunctionExpression inferred capture with literal operand"
covers_rule: "functionExpression, functionBody, returnStatement, binaryExpression, integerLiteral"
expected: "ACCEPT"
notes:
  - "RFC 0057 slice 2: an inferred by-value scalar capture combined with an integer literal in an arithmetic body (identifier operand first) parses legally; capture-plus-literal admission is a checker decision behind --experimental-captures, never a grammar one."
