section: "§4 FunctionExpression two-parameter unused-second unary block body"
covers_rule: "functionExpression, functionParameter, functionBody, returnStatement, unaryExpression"
expected: "ACCEPT"
notes:
  - "RFC 0057 slice 2: a two-parameter unary block body that uses only the position-zero parameter parses and lowers legally; an unused declared parameter is a compiler capability decision, never a grammar one."
