section: "§4 LambdaExpression second-position parameter with literal expression body"
covers_rule: "lambdaExpression, lambdaParameterList, lambdaExpressionBody, binaryExpression, identifier, integerLiteral"
expected: "ACCEPT"
notes:
  - "RFC 0057 slice 2: a two-parameter parameter-plus-literal expression-body lambda that uses the position-one parameter (the first parameter unused) parses and lowers legally; which declared parameter the identifier names is a compiler capability decision, never a grammar one."
